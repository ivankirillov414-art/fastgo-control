<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карточка приёмки — FastGo Storage</title><style>:root{--b:#0b0f14;--p:#141b23;--l:#293542;--t:#eef2f7;--m:#96a3b4;--g:#b8ff35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px system-ui}main{max-width:760px;margin:auto;padding:24px 16px}h1{margin:0}.num{font-size:34px;font-weight:900;color:var(--g);margin:8px 0 20px}.box{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px;margin:10px 0}.label{font-size:12px;color:var(--m);text-transform:uppercase;margin-bottom:4px}.value{font-size:19px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:900;background:var(--g);color:#10150b}.secondary{background:#25303d;color:white}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{background:var(--p);border:1px solid var(--l);border-radius:14px;overflow:hidden}.photo img{display:block;width:100%;height:220px;object-fit:cover;cursor:pointer}.photo b{display:block;padding:10px 12px;font-size:13px}.hidden{display:none}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:92vh;object-fit:contain}.viewer button{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:46px;height:46px;font-size:25px;background:white;color:black}@media(max-width:600px){.row,.photos{grid-template-columns:1fr}.photo img{height:auto;max-height:420px}}</style></head><body><main><h1>FastGo Storage</h1><div class="num" id="num">Загрузка…</div><div class="row"><div class="box"><div class="label">Клиент</div><div class="value" id="fio"></div></div><div class="box"><div class="label">Телефон</div><div class="value" id="phone"></div></div></div><div class="row"><div class="box"><div class="label">Техника</div><div class="value" id="bike"></div></div><div class="box"><div class="label">Серийный номер</div><div class="value" id="serial"></div></div></div><div class="box"><div class="label">Тариф</div><div class="value" id="tariff"></div></div><div class="box"><div class="label">Неисправности</div><div class="value" id="fault"></div></div><div class="box"><div class="label">Состояние / повреждения</div><div class="value" id="condition"></div></div><div class="box"><div class="label">Комплектация</div><div class="value" id="accessories"></div></div><section id="photoSection" class="hidden"><h2>Фотографии при приёмке</h2><div id="photos" class="photos"></div></section><div class="btns"><a id="contract" class="btn" href="#">Договор / печать</a><a class="btn secondary" href="storage-list.html">Все приёмки</a></div></main><div id="viewer" class="viewer" onclick="closeViewer()"><button aria-label="Закрыть">×</button><img id="viewerImg"></div><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-storage-api',$=x=>document.getElementById(x);function openViewer(src){$('viewerImg').src=src;$('viewer').classList.add('open')}function closeViewer(){$('viewer').classList.remove('open')}async function photoUrl(path){if(!path)return null;if(/^https?:\/\//i.test(path))return path;try{let d=await api('signed_url',{path});return d?.url||d?.signed_url||null}catch(e){try{let d=await api('get_url',{path});return d?.url||d?.signed_url||null}catch(x){return null}}}async function api(action,params){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,params})}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j.data}async function addPhoto(path,label){let u=await photoUrl(path);if(!u)return;let el=document.createElement('div');el.className='photo';let im=document.createElement('img');im.src=u;im.alt=label;im.onclick=()=>openViewer(u);let b=document.createElement('b');b.textContent=label;el.append(im,b);$('photos').append(el);$('photoSection').classList.remove('hidden')}async function load(){let id=new URLSearchParams(location.search).get('id');if(!id){$('num').textContent='Не указан ID приёмки';return}try{let d=await api('get',{id});if(!d){$('num').textContent='Приёмка не найдена';return}$('num').textContent='Приёмка № '+String(d.storage_number).padStart(4,'0');$('fio').textContent=[d.last_name,d.first_name,d.middle_name].filter(Boolean).join(' ')||'не указано';$('phone').textContent=d.phone||'не указан';$('bike').textContent=[d.brand,d.model].filter(Boolean).join(' ')||'не указана';$('serial').textContent=d.serial_number||'не указан';$('tariff').textContent=d.storage_tariff==='season'?'Сезонное хранение — 7 990 ₽':'Помесячное — '+(d.storage_months||1)+' мес. — '+Number(d.storage_amount||0).toLocaleString('ru-RU')+' ₽';$('fault').textContent=d.issue_description||'не заявлены';$('condition').textContent=d.condition_notes||'не указано';$('accessories').textContent=d.accessories||'не указана';$('contract').href='storage-contract.html?id='+encodeURIComponent(d.id);await addPhoto(d.scooter_photo_path,'Общий вид самоката');await addPhoto(d.display_photo_path,'Включённый дисплей');await addPhoto(d.motor_photo_path,'Мотор-колесо');let fs=Array.isArray(d.fault_photo_paths)?d.fault_photo_paths:[];for(let i=0;i<fs.length;i++)await addPhoto(fs[i],'Неисправность '+(i+1));if(!$('photos').children.length){$('photoSection').classList.remove('hidden');$('photos').innerHTML='<div class="box"><div class="value">Фотографии не найдены</div></div>'}}catch(e){$('num').textContent='Ошибка загрузки приёмки'}}load()</script></body></html>
