<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Все приёмки — FastGo Storage</title><style>:root{--b:#0b0f14;--p:#141b23;--l:#293542;--t:#eef2f7;--m:#96a3b4;--g:#b8ff35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px system-ui}main{max-width:1100px;margin:auto;padding:30px 18px}h1{font-size:36px}.top{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:13px 18px;border-radius:12px;background:var(--g);color:#10150b;text-decoration:none;font-weight:900}input{width:100%;padding:15px;margin:22px 0 12px;border:1px solid #3a4859;border-radius:12px;background:#0e141b;color:white;font:inherit}.item{display:grid;grid-template-columns:90px 1.4fr 1fr auto;gap:14px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px;margin:10px 0}.n{font-size:22px;font-weight:900;color:var(--g)}.muted{color:var(--m);font-size:14px}.acts{display:flex;gap:7px;flex-wrap:wrap}.acts a{padding:9px 11px;border-radius:9px;background:#25303d;color:white;text-decoration:none;font-size:14px}.acts a:first-child{background:var(--g);color:#10150b;font-weight:800}@media(max-width:700px){.item{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><main><div class="top"><a class="btn" href="storage.html">+ Новая приёмка</a></div><h1>Все приёмки</h1><input id="q" placeholder="Поиск: ФИО, телефон, самокат…"><div id="list">Загрузка…</div></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-storage-api';let all=[];async function load(){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'list',params:{}})}),j=await r.json();all=j.data||[];draw()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){let q=document.getElementById('q').value.toLowerCase(),a=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="n">№ ${String(x.storage_number).padStart(4,'0')}</div><div><b>${esc([x.last_name,x.first_name,x.middle_name].filter(Boolean).join(' '))}</b><div class="muted">${esc(x.phone)}</div></div><div><b>${esc(x.brand)} ${esc(x.model)}</b><div class="muted">${x.storage_tariff==='season'?'Сезон — 7 990 ₽':esc(x.storage_months)+' мес. — '+Number(x.storage_amount||0).toLocaleString('ru-RU')+' ₽'}${x.documents_uploaded_at?' · договор загружен ✓':''}</div></div><div class="acts"><a href="storage-contract.html?id=${x.id}" target="_blank">Печать договора</a><a href="storage-intake.html?id=${x.id}">Открыть приёмку</a></div></div>`).join(''):'Приёмки не найдены'}document.getElementById('q').oninput=draw;load()</script></body></html>
