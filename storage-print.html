<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Все приёмки — печать | FastGo Storage</title><style>:root{--b:#0b0f14;--p:#141b23;--l:#293542;--t:#eef2f7;--m:#96a3b4;--g:#b8ff35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui}main{max-width:1400px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:36px;margin:0 0 4px}.muted{color:var(--m)}.controls{display:flex;gap:10px;margin:22px 0}input{flex:1;padding:14px;border:1px solid #3a4859;border-radius:11px;background:#0e141b;color:white;font:inherit}.refresh{border:0;border-radius:11px;padding:0 18px;background:#25303d;color:white;font-weight:800;cursor:pointer}.item{display:grid;grid-template-columns:95px 1.35fr 1fr 170px 300px;gap:16px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:15px;margin:9px 0}.n{font-size:21px;font-weight:900;color:var(--g)}.acts{display:flex;gap:8px}.acts a{display:inline-block;padding:11px 13px;border-radius:9px;text-decoration:none;font-weight:800;text-align:center}.print{background:var(--g);color:#10150b}.open{background:#25303d;color:white}.status{font-size:13px;color:var(--m)}@media(max-width:950px){.item{grid-template-columns:1fr}.acts{justify-content:flex-start}}</style></head><body><main><header><div><h1>Все приёмки</h1><div class="muted">Рабочее место печати договоров</div></div><div class="muted" id="count"></div></header><div class="controls"><input id="q" autofocus placeholder="Поиск по номеру, ФИО, телефону, марке или модели"><button class="refresh" onclick="load()">Обновить</button></div><div id="list">Загрузка…</div></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-storage-api';let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){document.getElementById('list').textContent='Загрузка…';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'list',params:{}})}),j=await r.json();all=j.data||[];draw()}catch(e){document.getElementById('list').textContent='Ошибка загрузки. Нажмите «Обновить».'}}function draw(){let q=document.getElementById('q').value.trim().toLowerCase(),a=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('count').textContent='Показано: '+a.length+' из '+all.length;document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="n">№ ${String(x.storage_number).padStart(4,'0')}</div><div><b>${esc([x.last_name,x.first_name,x.middle_name].filter(Boolean).join(' '))}</b><div class="status">${esc(x.phone)}</div></div><div><b>${esc(x.brand)} ${esc(x.model)}</b><div class="status">${x.storage_tariff==='season'?'Сезон — 7 990 ₽':esc(x.storage_months)+' мес. — '+Number(x.storage_amount||0).toLocaleString('ru-RU')+' ₽'}</div></div><div class="status">${x.documents_uploaded_at?'Договор загружен ✓':'Готов к печати'}</div><div class="acts"><a class="print" href="storage-contract.html?id=${encodeURIComponent(x.id)}" target="_blank">Печать договора</a><a class="open" href="storage-intake.html?id=${encodeURIComponent(x.id)}" target="_blank">Приёмка</a></div></div>`).join(''):'Приёмки не найдены'}document.getElementById('q').addEventListener('input',draw);load();setInterval(load,60000)</script></body></html>
