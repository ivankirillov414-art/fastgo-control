<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лист мастера — FastGo Storage</title><style>body{margin:0;background:#ddd;font:14px Arial;color:#111}.tools{text-align:center;padding:12px;background:#111;color:white}.tools button{padding:11px 25px;background:#b8ff35;border:0;border-radius:8px;font-weight:bold}.page{width:210mm;min-height:297mm;margin:15px auto;padding:15mm;background:white;box-sizing:border-box}h1{margin:0;font-size:24px}.head{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:12px}.num{font-size:30px;font-weight:bold}.qr{width:145px;height:145px}.box{border:1px solid #aaa;border-radius:8px;padding:12px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:11px;color:#666;text-transform:uppercase}.value{font-size:18px;font-weight:bold;margin-top:3px}@media(max-width:850px){.page{width:100%;margin:0;min-height:auto}.row{grid-template-columns:1fr}}@media print{body{background:white}.tools{display:none}.page{margin:0;width:auto;padding:10mm}@page{size:A4;margin:0}}</style></head><body><div class="tools"><button onclick="print()">Печать листа мастера</button></div><main class="page"><div class="head"><div><h1>FASTGO STORAGE</h1><div>Лист мастера / карточка техники</div><div class="num" id="num">№ ____</div></div><img id="qr" class="qr"></div><div class="box row"><div><div class="label">Клиент</div><div class="value" id="fio"></div></div><div><div class="label">Телефон</div><div class="value" id="phone"></div></div></div><div class="box row"><div><div class="label">Техника</div><div class="value" id="bike"></div></div><div><div class="label">Серийный номер</div><div class="value" id="serial"></div></div></div><div class="box"><div class="label">Тариф</div><div class="value" id="tariff"></div></div><div class="box"><div class="label">Заявленные неисправности</div><div class="value" id="fault"></div></div><div class="box"><div class="label">Состояние / повреждения</div><div id="condition"></div></div><div class="box"><div class="label">Комплектация</div><div id="accessories"></div></div><p>QR-код открывает карточку конкретной приёмки FastGo Storage.</p></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-storage-api',$=x=>document.getElementById(x);async function load(){let id=new URLSearchParams(location.search).get('id');if(!id)return;let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'get',params:{id}})}),j=await r.json(),d=j.data;if(!d)return;$('num').textContent='№ '+String(d.storage_number).padStart(4,'0');$('fio').textContent=[d.last_name,d.first_name,d.middle_name].filter(Boolean).join(' ');$('phone').textContent=d.phone;$('bike').textContent=d.brand+' '+d.model;$('serial').textContent=d.serial_number||'не указан';$('tariff').textContent=d.storage_tariff==='season'?'Сезонное хранение — 7 990 ₽':'Помесячное — '+d.storage_months+' мес. — '+Number(d.storage_amount).toLocaleString('ru-RU')+' ₽';$('fault').textContent=d.issue_description||'не заявлены';$('condition').textContent=d.condition_notes||'не указано';$('accessories').textContent=d.accessories||'не указана';let u=location.origin+location.pathname.replace('storage-master-sheet.html','storage-contract.html')+'?id='+encodeURIComponent(d.id);$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u)}load()</script></body></html>
