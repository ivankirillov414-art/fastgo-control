<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastGo — заявки аренды</title><style>:root{--bg:#0b0f14;--panel:#141b23;--panel2:#0e141b;--line:#293542;--text:#eef2f7;--muted:#96a3b4;--accent:#b8ff35;--purple:#c43cff;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:22px 5%;border-bottom:1px solid var(--line);font-size:25px;font-weight:900}header b{color:var(--accent)}main{max-width:1100px;margin:auto;padding:25px 5%}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.login input{flex:1;min-width:220px}input,button{padding:12px;border-radius:11px;border:1px solid #344252;background:var(--panel2);color:#fff;font:inherit}button{background:var(--accent);color:#10150b;border:0;font-weight:850;cursor:pointer}.danger{background:var(--red);color:#fff}.secondary{background:#26313c;color:#fff}.hidden{display:none}.muted{color:var(--muted)}.request{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.request.pending{border-color:rgba(196,60,255,.55)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0}.field{background:#121922;border-radius:10px;padding:10px}.field small{display:block;color:var(--muted)}.docs button{margin:5px 5px 5px 0}.actions{display:flex;gap:8px;margin-top:12px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#26313c;font-size:12px}</style></head><body><header>FAST<b>GO</b> · ЗАЯВКИ</header><main><section id="login" class="card login"><h2>Вход владельца</h2><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button></div><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><div class="row"><h2 style="margin-right:auto">Заявки аренды</h2><button id="refresh">Обновить</button><button id="logout" class="secondary">Выйти</button></div><div id="list"></div></div></section></main><script>const URL='https://oqgpjfikjpcplnxueoki.supabase.co',KEY='sb_publishable_-aVkOpeHXncVZhF2jPuG5w_4DkRYqji',API=URL+'/functions/v1/fastgo-ui-api',$=x=>document.getElementById(x);let token=localStorage.getItem('fastgo_token')||'';const esc=v=>String(v??'—').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]));async function call(action,params={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({action,params})}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j.data}async function login(){try{let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'content-type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'Ошибка входа');token=j.access_token;localStorage.setItem('fastgo_token',token);show();load()}catch(e){$('msg').textContent=e.message}}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}async function doc(path){try{let d=await call('rental_document_url',{path});window.open(d.signedUrl,'_blank')}catch(e){alert(e.message)}}async function review(id,decision){if(!confirm(decision==='approve'?'Подтвердить личность и оплату? Велосипед будет зарезервирован.':'Отклонить заявку?'))return;try{await call('review_rental_request',{id,decision});await load()}catch(e){alert(e.message)}}async function load(){try{let d=await call('public_rental_requests');$('list').innerHTML=d.map(x=>`<div class="request ${x.status==='pending_payment_confirmation'?'pending':''}"><div class="row"><b>${esc(x.customer_name)}</b><span class="pill">${esc(x.status)}</span><span class="pill">оплата: ${esc(x.payment_status)}</span><span class="pill">личность: ${esc(x.identity_status)}</span></div><div class="grid"><div class="field"><small>Велосипед</small>${esc(x.bike_code)}</div><div class="field"><small>Тариф</small>${esc(x.tariff_code)}</div><div class="field"><small>Сумма</small>${esc(x.amount)} ₽</div><div class="field"><small>Телефон</small>${esc(x.customer_phone)}</div><div class="field"><small>Период</small>${new Date(x.starts_at).toLocaleDateString('ru-RU')} — ${new Date(x.ends_at).toLocaleDateString('ru-RU')}</div><div class="field"><small>Заявка</small>${esc(x.id.slice(0,8).toUpperCase())}</div></div><div class="docs">${x.passport_front_path?`<button class="secondary" onclick="doc('${esc(x.passport_front_path)}')">Паспорт</button>`:''}${x.selfie_path?`<button class="secondary" onclick="doc('${esc(x.selfie_path)}')">Селфи</button>`:''}${x.payment_receipt_path?`<button class="secondary" onclick="doc('${esc(x.payment_receipt_path)}')">Чек</button>`:''}</div>${!['confirmed','rejected'].includes(x.status)?`<div class="actions"><button onclick="review('${x.id}','approve')">Подтвердить</button><button class="danger" onclick="review('${x.id}','reject')">Отклонить</button></div>`:''}</div>`).join('')||'<p class="muted">Заявок пока нет.</p>'}catch(e){$('list').innerHTML='<p>'+esc(e.message)+'</p>'}}$('loginBtn').onclick=login;$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('fastgo_token');location.reload()};if(token){show();load()}</script></body></html>
