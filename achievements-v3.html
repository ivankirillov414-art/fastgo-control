<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030308"><title>Personal RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030308}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="achievements.html"></iframe><script>const frame=document.getElementById('game');frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!d||!w)return;const css=d.createElement('style');css.textContent=`.proof{background:#090711;border:1px solid #4a3763;border-radius:14px;padding:14px;margin:14px 0}.proof b{display:block;margin-bottom:8px}.proof small{display:block;color:#8e859a;margin:7px 0 10px}.proofbox{border:1px dashed #7651a8;border-radius:12px;padding:14px;text-align:center;color:#bd94ff;cursor:pointer}.proofbox.ready{border-color:#55c786;color:#78d99f;background:#08130d}.proofname{font-size:11px;color:#aaa1b5;margin-top:8px;word-break:break-all}.proofpreview{display:none;max-width:100%;max-height:180px;margin:10px auto 0;border-radius:10px}.verifymsg{font-size:11px;color:#d7b1ff;margin-top:8px}`;d.head.appendChild(css);const mission=d.querySelector('.mission');if(!mission)return;const proof=d.createElement('div');proof.className='proof';proof.innerHTML='<b>ПОДТВЕРЖДЕНИЕ РЕЗУЛЬТАТА</b><small>Приложи фото результата или файл модели. Для серьёзных квестов доказательство обязательно.</small><label class="proofbox" id="proofbox">＋ Добавить фото или файл<input id="proofinput" type="file" accept="image/*,.stl,.step,.stp,.f3d,.obj,.3mf,.scad" hidden></label><div class="proofname" id="proofname">Доказательство ещё не добавлено</div><img id="proofpreview" class="proofpreview"><div id="verifymsg" class="verifymsg"></div>';mission.after(proof);let evidence=null;const input=d.getElementById('proofinput'),box=d.getElementById('proofbox'),name=d.getElementById('proofname'),preview=d.getElementById('proofpreview'),msg=d.getElementById('verifymsg');input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;evidence={name:f.name,type:f.type,size:f.size,time:Date.now()};name.textContent='✓ '+f.name+' · '+Math.max(1,Math.round(f.size/1024))+' КБ';box.classList.add('ready');box.childNodes[0].nodeValue='✓ Доказательство добавлено ';msg.textContent='Файл готов к подтверждению квеста.';if(f.type.startsWith('image/')){preview.src=URL.createObjectURL(f);preview.style.display='block'}else preview.style.display='none';syncButton()};const oldOpen=w.openNode;if(oldOpen)w.openNode=function(i){evidence=null;oldOpen(i);setTimeout(()=>{name.textContent='Доказательство ещё не добавлено';box.classList.remove('ready');preview.style.display='none';msg.textContent='';syncButton()},0)};function requiresProof(){const t=(d.getElementById('tag')?.textContent||'');return !t.startsWith('E-RANK')}function syncButton(){const b=d.getElementById('complete');if(!b)return;const studied=w.state?w.state.studied.includes(w.selected):!b.disabled;b.disabled=!studied||(requiresProof()&&!evidence);if(requiresProof()&&!evidence&&studied)msg.textContent='Для этого ранга сначала добавь подтверждение.'}const oldStudied=w.studied;if(oldStudied)w.studied=function(){oldStudied();syncButton()};const oldComplete=w.complete;if(oldComplete)w.complete=function(){if(requiresProof()&&!evidence){msg.textContent='Нужно приложить фото или файл результата.';return}if(evidence){try{const log=JSON.parse(localStorage.getItem('personal_rpg_evidence')||'{}');log[w.selected]=evidence;localStorage.setItem('personal_rpg_evidence',JSON.stringify(log))}catch(e){}}oldComplete()};new MutationObserver(syncButton).observe(d.getElementById('panel'),{attributes:true,subtree:true,attributeFilter:['class','disabled']});};</script></body></html>
