<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastGo · все экраны сервиса</title><style>*{box-sizing:border-box}body{margin:0;background:#07111d;color:#e9f3ff;font:15px/1.45 system-ui}header{padding:20px 28px;border-bottom:1px solid #25405b;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:23px;margin:0}header p{margin:3px 0;color:#9fb3c9;font-size:13px}.brand{color:#1abcf5}button,a{font:inherit}button{background:#142b43;border:1px solid #345773;color:#e9f3ff;padding:9px 12px;border-radius:8px;cursor:pointer}button.active{background:#0879db;border-color:#1dafff}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 110px)}aside{padding:16px;border-right:1px solid #25405b}aside button{display:block;width:100%;text-align:left;margin:0 0 5px;font-size:13px;padding:10px}aside b{display:inline-block;color:#5ad4ff;width:24px}main{padding:22px;min-width:0}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top h2{font-size:20px;margin:0 auto 0 0}.note{font-size:12px;color:#9fb3c9}.stage{max-width:1200px;margin:auto}.framewrap{position:relative;margin:14px auto;background:#08101c;border-radius:14px;outline:1px solid #335570;overflow:hidden}iframe{border:0;transform-origin:0 0;display:block;background:#08101c}.controls{display:flex;justify-content:center;gap:12px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.card{border:1px solid #2b4560;border-radius:12px;overflow:hidden;background:#101f31}.card h3{margin:0;padding:12px;font-size:14px}.card img{display:block;width:100%;cursor:zoom-in}.card div{padding:10px;display:flex;gap:8px}.card button{font-size:12px}dialog{background:#091522;color:#fff;border:1px solid #426585;border-radius:12px;max-width:96vw;max-height:96vh;padding:12px}dialog::backdrop{background:#000b}dialog img{display:block;width:390px;max-width:85vw;height:auto}dialog button{position:sticky;top:0;display:block;margin-left:auto}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}header{padding:14px}main{padding:12px}.top h2{flex-basis:100%}}</style>
<header><div><h1><span class="brand">FastGo</span> · приёмка → выдача</h1><p>Реальные экраны опубликованного Android 1.0.6 · без складских экранов</p></div><button id="all">Все экраны</button><button id="live" class="active">Живой просмотр</button></header><div class="layout"><aside id="steps"></aside><main><div class="top"><h2 id="title"></h2><button id="phone" class="active">Телефон</button><button id="desktop">Ноутбук</button></div><p class="note">Демонстрационная заявка № 1042. Кнопки работают с локальными тестовыми данными; рабочие заказы не изменяются.</p><section id="stage" class="stage"><div id="wrap" class="framewrap"><iframe id="app" title="Обновлённое приложение FastGo"></iframe></div><div class="controls"><button id="prev">← Назад</button><span id="count"></span><button id="next">Далее →</button></div></section><section id="grid" class="grid" hidden></section></main></div><dialog id="zoom"><button onclick="document.getElementById('zoom').close()">Закрыть ✕</button><img id="large" alt="Экран приложения в полном размере"></dialog>
<script>let screens=[],index=1,device='phone',mode='live';const $=s=>document.getElementById(s);function resize(){const w=device==='phone'?390:1366,h=device==='phone'?844:900,available=$('stage').clientWidth,scale=Math.min(1,available/w);$('wrap').style.width=w*scale+'px';$('wrap').style.height=h*scale+'px';$('app').style.width=w+'px';$('app').style.height=h+'px';$('app').style.transform='scale('+scale+')';}function choose(i){index=Math.max(0,Math.min(i,screens.length-1));const s=screens[index];$('title').textContent=s.title;$('count').textContent=(index+1)+' / '+screens.length;$('app').src='app/workshop.html?stage='+encodeURIComponent(s.stage)+'&screen='+s.id+s.route;document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',Number(b.dataset.step)===index));$('prev').disabled=index===0;$('next').disabled=index===screens.length-1;resize();}function view(m){mode=m;$('grid').hidden=m!=='grid';$('stage').hidden=m==='grid';$('all').classList.toggle('active',m==='grid');$('live').classList.toggle('active',m==='live');$('title').textContent=m==='grid'?'Все экраны сервиса':screens[index].title;$('phone').hidden=m==='grid';$('desktop').hidden=m==='grid';if(m==='live')resize();}fetch('./screens.json').then(r=>r.json()).then(data=>{screens=data.screens;$('all').textContent='Все '+screens.length+' экранов';$('steps').innerHTML=screens.map((s,i)=>'<button data-step="'+i+'"><b>'+String(i+1).padStart(2,'0')+'</b> '+s.title+'</button>').join('');$('grid').innerHTML=screens.map((s,i)=>'<article class="card"><h3>'+String(i+1).padStart(2,'0')+' · '+s.title+'</h3><img loading="lazy" src="shots/'+s.id+'.png" data-zoom="'+s.id+'" alt="'+s.title+'"><div><button data-open="'+i+'">Открыть живой экран</button></div></article>').join('');document.querySelectorAll('[data-step],[data-open]').forEach(b=>b.onclick=()=>{choose(Number(b.dataset.step??b.dataset.open));view('live');});document.querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{$('large').src=img.src;$('zoom').showModal();});choose(1);view(new URLSearchParams(location.search).get('view')==='live'?'live':'grid');});$('all').onclick=()=>view('grid');$('live').onclick=()=>view('live');$('prev').onclick=()=>choose(index-1);$('next').onclick=()=>choose(index+1);for(const d of ['phone','desktop'])$(d).onclick=()=>{device=d;$(d).classList.add('active');$(d==='phone'?'desktop':'phone').classList.remove('active');resize();};addEventListener('resize',resize);</script></html>
