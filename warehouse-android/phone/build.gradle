plugins { id 'com.android.application' }
android {
 namespace 'ru.fastgo.mobile'
 compileSdk 36
 defaultConfig { applicationId 'ru.fastgo.mobile'; minSdk 23; targetSdk 36; versionCode 9; versionName '1.0.8'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 if(project.hasProperty('fastgoPhoneFixture')){defaultConfig {versionCode 10;versionName '1.0.8-self-update-test'}}
 buildTypes { release { minifyEnabled false }; debug { applicationIdSuffix '.test' } }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
