<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastGo — клиент</title>
<style>
:root{--bg:#0b0f14;--panel:#141b23;--panel2:#0e141b;--line:#293542;--text:#eef2f7;--muted:#96a3b4;--accent:#b8ff35;--danger:#f07474}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.logo{display:flex;align-items:center}.logo img{display:block;width:min(330px,72vw);height:auto;object-fit:contain}
main{max-width:860px;margin:auto;padding:26px 5% 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap} input,select,button{font:inherit;padding:13px;border-radius:11px;border:1px solid #3a4859;background:var(--panel2);color:#fff}
input,select{min-width:220px;flex:1} button{border:none;background:var(--accent);color:#10150b;font-weight:800;cursor:pointer}
button.secondary{background:#26313c;color:#fff} button.danger{background:var(--danger);color:#fff}.hidden{display:none!important}.muted{color:var(--muted)}.error{color:#ff9a9a}.ok{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{background:var(--panel2);border:1px solid #202b36;border-radius:14px;padding:15px}
.pill{display:inline-block;padding:4px 8px;background:#26313c;border-radius:99px;font-size:12px}
@media(max-width:640px){input,select,button{width:100%;min-width:0}}
</style>
</head>
<body>
<header><div class="logo"><img src="fastgo-logo.png" alt="FastGo"></div></header>
<main>
<section id="auth" class="card">
<h2>Вход / регистрация</h2>
<div class="row" style="display:block">
<input id="email" type="email" placeholder="Email" style="display:block;width:100%;margin-bottom:12px">
<input id="password" type="password" placeholder="Пароль (минимум 6 символов)" style="display:block;width:100%">
</div>
<div class="row" style="margin-top:12px">
<button id="loginBtn">Войти</button>
<button id="signupBtn" class="secondary">Зарегистрироваться</button>
</div>
<p id="authMsg" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="card row">
<button id="bookTab">Забронировать</button>
<button id="mineTab" class="secondary">Мои брони</button>
<button id="logoutBtn" class="danger">Выйти</button>
</div>

<section id="book">
<div class="card">
<h2>Бронирование велосипеда</h2>
<div class="row">
<input id="startsAt" type="datetime-local">
<input id="endsAt" type="datetime-local">
<select id="tariff"><option value="">Загрузка тарифов…</option></select>
</div>
<div class="row" style="margin-top:12px"><button id="findBtn">Найти свободные</button></div>
<p id="bookMsg" class="muted"></p>
</div>
<div class="card"><h2>Свободные велосипеды</h2><div id="available" class="grid"></div></div>
</section>

<section id="mine" class="hidden">
<div class="card"><div class="row"><h2 style="margin-right:auto">Мои брони</h2><button id="refreshMine">Обновить</button></div><div id="myBookings" class="grid"></div></div>
</section>

<section id="tech" class="hidden">
<div class="card">
<h2>Техническая карточка</h2>
<p id="techMsg" class="muted">Загрузка…</p>
<div id="techCard" class="grid"></div>
</div>
</section>
</section>
</main>

<script>
const P="https://oqgpjfikjpcplnxueoki.supabase.co";
const K="sb_publishable_-aVkOpeHXncVZhF2jPuG5w_4DkRYqji";
const API=P+"/functions/v1/fastgo-booking-api";
const UIAPI=P+"/functions/v1/fastgo-ui-api";
const qrBike=(new URLSearchParams(location.search).get("bike")||"").trim().toUpperCase();
let token=localStorage.getItem("fastgo_client_token")||"";
const $=id=>document.getElementById(id);

async function auth(path,body){
  const r=await fetch(P+path,{method:"POST",headers:{"content-type":"application/json","apikey":K},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw Error(j.msg||j.error_description||j.message||j.error||"Ошибка"); return j;
}
async function signup(){
  $("authMsg").textContent="";
  try{
    const email=$("email").value.trim(), password=$("password").value;
    if(!email||password.length<6) throw Error("Введите email и пароль от 6 символов.");
    const j=await auth("/auth/v1/signup",{email,password});
    if(j.access_token){token=j.access_token;localStorage.setItem("fastgo_client_token",token);showApp();await init();}
    else {$("authMsg").className="ok";$("authMsg").textContent="Аккаунт создан. Проверьте email и подтвердите регистрацию, затем войдите.";}
  }catch(e){$("authMsg").className="error";$("authMsg").textContent=e.message}
}
async function login(){
  $("authMsg").textContent="";
  try{
    const j=await auth("/auth/v1/token?grant_type=password",{email:$("email").value.trim(),password:$("password").value});
    token=j.access_token;localStorage.setItem("fastgo_client_token",token);showApp();await init();
  }catch(e){$("authMsg").className="error";$("authMsg").textContent=e.message}
}
async function call(action,params={}){
  const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({action,params})});
  const j=await r.json(); if(r.status===401){logout();throw Error("Сессия истекла.")} if(!r.ok) throw Error(j.reason||j.error||"Ошибка API"); return j;
}
function showApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");}
function logout(){localStorage.removeItem("fastgo_client_token");location.reload()}
function esc(x){return String(x??"—").replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[s]))}

async function loadTariffs(){const j=await call("tariffs");$("tariff").innerHTML=(j.data||[]).map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.price)} ₽, залог ${esc(t.deposit)} ₽</option>`).join("")}
async function findBikes(){
  $("bookMsg").textContent="";
  try{
    const s=$("startsAt").value,e=$("endsAt").value,tariff=$("tariff").value;if(!s||!e||!tariff)throw Error("Выберите даты и тариф.");
    const j=await call("availability",{starts_at:new Date(s).toISOString(),ends_at:new Date(e).toISOString()});
    $("available").innerHTML=(j.data||[]).map(b=>`<div class="item"><b>${esc(b.asset_code||b.id)}</b><p class="muted">${esc(b.model||"FastGo Courier")}</p><button onclick="createBooking('${b.id}')">Забронировать</button></div>`).join("")||'<span class="muted">Свободных велосипедов нет.</span>';
  }catch(e){$("bookMsg").className="error";$("bookMsg").textContent=e.message}
}
async function createBooking(bikeId){
  try{
    const j=await call("create_booking",{bike_id:bikeId,tariff_id:$("tariff").value,starts_at:new Date($("startsAt").value).toISOString(),ends_at:new Date($("endsAt").value).toISOString()});
    $("bookMsg").className="ok";$("bookMsg").textContent="Бронь создана. К оплате: "+j.payment_required+" ₽. Бронь удерживается 15 минут.";await loadMine();
  }catch(e){$("bookMsg").className="error";$("bookMsg").textContent=e.message}
}
async function loadMine(){
  try{
    const j=await call("my_bookings");
    $("myBookings").innerHTML=(j.data||[]).map(x=>`<div class="item"><b>Бронь</b> <span class="pill">${esc(x.status)}</span><p class="muted">${new Date(x.starts_at).toLocaleString("ru-RU")} → ${new Date(x.ends_at).toLocaleString("ru-RU")}<br>Аренда: ${esc(x.quoted_amount)} ₽ · залог: ${esc(x.deposit_amount)} ₽</p></div>`).join("")||'<span class="muted">Бронирований пока нет.</span>';
  }catch(e){$("myBookings").innerHTML='<span class="error">'+esc(e.message)+'</span>'}
}
async function uiCall(action,params={}){
  const r=await fetch(UIAPI,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({action,params})});
  const j=await r.json();
  if(!r.ok) throw Object.assign(new Error(j.error||"Ошибка API"),{status:r.status});
  return j;
}
async function openQrBike(){
  if(!qrBike) return false;
  if(!token) return false;
  try{
    const j=await uiCall("bike_card",{asset_code:qrBike});
    $("book").classList.add("hidden");$("mine").classList.add("hidden");$("tech").classList.remove("hidden");
    const d=j.data||{};
    $("techMsg").className="ok";$("techMsg").textContent="Доступ: "+(j.role||"staff");
    $("techCard").innerHTML=Object.entries(d).map(([k,v])=>`<div class="item"><b>${esc(k)}</b><p class="muted">${esc(v)}</p></div>`).join("");
    return true;
  }catch(e){
    if(e.status===403){ history.replaceState({},document.title,location.pathname); return false; }
    $("book").classList.add("hidden");$("mine").classList.add("hidden");$("tech").classList.remove("hidden");
    $("techMsg").className="error";$("techMsg").textContent=e.message; return true;
  }
}
async function init(){
  if(await openQrBike()) return;
  await Promise.allSettled([loadTariffs(),loadMine()]);
  const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());const later=new Date(now.getTime()+86400000);
  $("startsAt").value=now.toISOString().slice(0,16);$("endsAt").value=later.toISOString().slice(0,16);
}
$("signupBtn").onclick=signup;$("loginBtn").onclick=login;$("logoutBtn").onclick=logout;$("findBtn").onclick=findBikes;$("refreshMine").onclick=loadMine;
$("bookTab").onclick=()=>{$("book").classList.remove("hidden");$("mine").classList.add("hidden")};
$("mineTab").onclick=()=>{$("mine").classList.remove("hidden");$("book").classList.add("hidden");loadMine()};
if(token){showApp();init()}
</script>
</body></html>
