name: Staff price tasks
on:
 pull_request:
  paths: ['workshop/**','supabase/functions/**','supabase/migrations/**','scripts/check-staff-price-tasks.cjs','scripts/build-staff-equipment.mjs','tests/staff-price-tasks.test.mjs','.github/workflows/staff-price-tasks.yml']
 push:
  branches: [main]
  paths: ['workshop/**','supabase/functions/**','supabase/migrations/**','scripts/check-staff-price-tasks.cjs','scripts/build-staff-equipment.mjs','tests/staff-price-tasks.test.mjs','.github/workflows/staff-price-tasks.yml']
permissions: {contents: read}
jobs:
 verify:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: node scripts/build-staff-equipment.mjs --check
   - run: node --test tests/staff-price-tasks.test.mjs tests/warehouse-equipment-prices.test.mjs tests/native-store.test.mjs
   - run: npm install --prefix /tmp/fastgo-staff playwright@1.62.1
   - run: /tmp/fastgo-staff/node_modules/.bin/playwright install --with-deps chromium
   - run: NODE_PATH=/tmp/fastgo-staff/node_modules node scripts/check-staff-price-tasks.cjs
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: staff-task-screens, path: browser-results/staff-task-*.png}
