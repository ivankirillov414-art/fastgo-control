name: Google workshop regression
on:
  push:
    branches: [main, codex/google-cutover-live]
    paths: ['workshop/**','workshop.html','supabase/functions/fastgo-*/**','tests/google-cutover.test.mjs','.github/workflows/google-cutover-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression
        run: |
          for f in workshop/*.js; do node --check "$f"; done
          node --check < supabase/functions/fastgo-workshop-api/index.ts
          node --check < supabase/functions/fastgo-storage-api/index.ts
          node --check < supabase/functions/fastgo-service-api/index.ts
          node --test tests/google-cutover.test.mjs tests/workshop-core.test.mjs
      - name: Live public health and authentication boundaries
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json
          base='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/'
          for slug in ['fastgo-workshop-api','fastgo-storage-api','fastgo-service-api']:
              with urllib.request.urlopen(base+slug,timeout=25) as r:
                  assert json.load(r).get('backend')=='GOOGLE_SHEETS_DRIVE'
              req=urllib.request.Request(base+slug,data=b'{"action":"catalog"}',headers={'Content-Type':'application/json'})
              try:
                  urllib.request.urlopen(req,timeout=25)
                  raise AssertionError('Anonymous request must fail')
              except urllib.error.HTTPError as e:
                  assert e.code==401
              print('PASS',slug,'Google backend; anonymous data access denied')
          PY
