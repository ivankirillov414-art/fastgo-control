name: FastGo Native TSD
on:
 pull_request:
  paths: ['warehouse-android/native/**','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties','scripts/check-native-apk-install.cjs','.github/workflows/tsd-native.yml']
 push:
  branches: [main]
  paths: ['warehouse-android/native/**','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties','scripts/check-native-apk-install.cjs','.github/workflows/tsd-native.yml']
 workflow_dispatch:
permissions: {contents: read}
jobs:
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: node --test tests/terminal-setup.test.mjs
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - name: Compile native app and test document protocol
     run: |
      gradle :native:testDebugUnitTest :native:assembleRelease --no-daemon
      mkdir -p native/build/release-package
      cp native/build/outputs/apk/release/native-release-unsigned.apk native/build/release-package/FastGo-TSD-2.1.8-unsigned.apk
      gradle :native:assembleRelease -PfastgoVersionCode=12 -PfastgoVersionName=2.1.9 --no-daemon
      cp native/build/outputs/apk/release/native-release-unsigned.apk native/build/release-package/FastGo-TSD-2.1.9-unsigned.apk
     working-directory: warehouse-android
   - uses: actions/upload-artifact@v4
     with:
      name: fastgo-tsd-native-unsigned
      path: warehouse-android/native/build/release-package/*.apk
      retention-days: 14

 emulator:
  runs-on: ubuntu-latest
  needs: android
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 29
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: |
       cd warehouse-android && gradle :native:assembleDebug -PfastgoVersionCode=12 -PfastgoVersionName=2.1.9 --no-daemon && mkdir -p native/src/androidTest/assets && cp native/build/outputs/apk/debug/native-debug.apk native/src/androidTest/assets/update-fixture.apk && gradle :native:connectedDebugAndroidTest --no-daemon && cd .. && node scripts/check-native-apk-install.cjs
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fastgo-tsd-native-tests
      path: |
       warehouse-android/native/build/reports/androidTests
       warehouse-android/native/build/upgrade-test
