name: FastGo Native TSD
on:
 pull_request:
  paths: ['warehouse-android/native/**','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties','.github/workflows/tsd-native.yml']
 push:
  branches: [main]
  paths: ['warehouse-android/native/**','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties','.github/workflows/tsd-native.yml']
 workflow_dispatch:
permissions: {contents: read}
jobs:
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Compile native app and test document protocol
     run: gradle :native:testDebugUnitTest :native:assembleRelease --no-daemon
     working-directory: warehouse-android
   - uses: actions/upload-artifact@v4
     with:
      name: fastgo-tsd-native-unsigned
      path: warehouse-android/native/build/outputs/apk/release/native-release-unsigned.apk
      retention-days: 14

 emulator:
  runs-on: ubuntu-latest
  needs: android
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 28
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: cd warehouse-android && gradle :native:connectedDebugAndroidTest --no-daemon
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fastgo-tsd-native-tests
      path: warehouse-android/native/build/reports/androidTests
