name: FastGo Android Phone
on:
 pull_request:
  paths: ['warehouse-android/phone/**','warehouse-android/settings.gradle','.github/workflows/android-phone.yml']
 push:
  branches: [main]
  paths: ['warehouse-android/phone/**','warehouse-android/settings.gradle','.github/workflows/android-phone.yml']
 workflow_dispatch:
permissions: {contents: read}
jobs:
 verify:
  runs-on: ubuntu-latest
  timeout-minutes: 25
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - run: node warehouse-android/phone/prepare-web.cjs
   - name: Build final phone package
     run: gradle :phone:assembleRelease :phone:assembleDebug --no-daemon
     working-directory: warehouse-android
   - name: Save public Android signing utility for local signing
     run: cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -n1)" warehouse-android/phone/build/apksigner.jar
   - name: Verify embedded UI integrity
     run: |
      python3 - <<'PY'
      import zipfile,json,hashlib
      p='warehouse-android/phone/build/outputs/apk/release/phone-release-unsigned.apk'
      with zipfile.ZipFile(p) as z:
       m=json.loads(z.read('assets/fastgo/bundle-receipt.json'))
       assert m['platform']=='android' and m['version']=='1.0.0'
       for name,expected in m['files'].items(): assert hashlib.sha256(z.read('assets/fastgo/'+name)).hexdigest()==expected
      print('PASS: installed APK contains verified service and warehouse assets')
      PY
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 29
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: |
       adb shell svc wifi disable
       adb shell svc data disable
       cd warehouse-android && gradle :phone:connectedDebugAndroidTest --no-daemon
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fastgo-android-phone-verified
      path: |
       warehouse-android/phone/build/apksigner.jar
       warehouse-android/phone/build/outputs/apk/release/*.apk
       warehouse-android/phone/build/outputs/apk/debug/*.apk
       warehouse-android/phone/build/reports/androidTests/
       warehouse-android/phone/src/main/assets/fastgo/bundle-receipt.json
 release-check:
  needs: verify
  runs-on: ubuntu-latest
  timeout-minutes: 20
  strategy:
   fail-fast: false
   matrix: {api: [29, 35]}
  steps:
   - uses: actions/checkout@v4
   - id: signed
     run: |
      if test -f warehouse-android/phone/release/receipt.json; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
   - uses: actions/setup-java@v4
     if: steps.signed.outputs.ready == 'true'
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     if: steps.signed.outputs.ready == 'true'
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     if: steps.signed.outputs.ready == 'true'
     with: {packages: platform-tools}
   - name: Enable KVM
     if: steps.signed.outputs.ready == 'true'
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     if: steps.signed.outputs.ready == 'true'
     env: {FASTGO_ANDROID_API: '${{ matrix.api }}'}
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: node scripts/check-phone-release.cjs
   - uses: actions/upload-artifact@v4
     if: always() && steps.signed.outputs.ready == 'true'
     with:
      name: fastgo-android-installed-${{ matrix.api }}
      path: browser-results/android-phone-${{ matrix.api }}/
