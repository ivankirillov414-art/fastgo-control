name: FastGo Android Phone
on:
 pull_request:
  paths: ['scripts/check-phone-*.cjs','scripts/check-phone-*.py','tests/phone_apk_identity_test.py','warehouse-android/build.gradle','warehouse-android/gradle.properties','warehouse-android/phone/**','warehouse-android/settings.gradle','workshop/**','workshop.html','workshop.css','warehouse/**','warehouse.html','vendor/**','.github/workflows/android-phone.yml']
 push:
  branches: [main]
  paths: ['scripts/check-phone-*.cjs','scripts/check-phone-*.py','tests/phone_apk_identity_test.py','warehouse-android/build.gradle','warehouse-android/gradle.properties','warehouse-android/phone/**','warehouse-android/settings.gradle','workshop/**','workshop.html','workshop.css','warehouse/**','warehouse.html','vendor/**','.github/workflows/android-phone.yml']
 workflow_dispatch:
permissions: {contents: read}
jobs:
 verify:
  runs-on: ubuntu-latest
  timeout-minutes: 25
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - run: node warehouse-android/phone/prepare-web.cjs
   - name: Build next-version debug self-update fixture
     run: |
      gradle :phone:assembleDebug -PfastgoPhoneFixture=true --no-daemon
      mkdir -p phone/src/debug/assets
      cp phone/build/outputs/apk/debug/phone-debug.apk phone/src/debug/assets/update-fixture.apk
     working-directory: warehouse-android
   - name: Build final phone package
     run: gradle :phone:assembleRelease :phone:assembleDebug --no-daemon
     working-directory: warehouse-android
   - name: Verify APK identity guard
     run: python3 -m unittest discover -s tests -p phone_apk_identity_test.py
   - name: Audit final release APK manifest
     run: python3 scripts/check-phone-apk.py warehouse-android/phone/build/outputs/apk/release/phone-release-unsigned.apk --output warehouse-android/phone/build/security-audit.json
   - name: Save public Android signing utility for local signing
     run: cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -n1)" warehouse-android/phone/build/apksigner.jar
   - name: Verify embedded UI integrity
     run: |
      python3 - <<'PY'
      import zipfile,json,hashlib
      p='warehouse-android/phone/build/outputs/apk/release/phone-release-unsigned.apk'
      with zipfile.ZipFile(p) as z:
       m=json.loads(z.read('assets/fastgo/bundle-receipt.json'))
       assert m['platform']=='android' and m['version']=='1.0.6'
       for name,expected in m['files'].items(): assert hashlib.sha256(z.read('assets/fastgo/'+name)).hexdigest()==expected
      print('PASS: installed APK contains verified service and warehouse assets')
      PY
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 29
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: |
       adb shell svc wifi disable
       adb shell svc data disable
       cd warehouse-android && gradle :phone:connectedDebugAndroidTest --no-daemon
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fastgo-android-phone-verified
      path: |
       warehouse-android/phone/build/security-audit.json
       warehouse-android/phone/build/apksigner.jar
       warehouse-android/phone/build/outputs/apk/release/*.apk
       warehouse-android/phone/build/outputs/apk/debug/*.apk
       warehouse-android/phone/build/reports/androidTests/
       warehouse-android/phone/src/main/assets/fastgo/bundle-receipt.json
 release-check:
  outputs:
   ready: ${{ steps.signed.outputs.ready }}
  needs: verify
  runs-on: ubuntu-latest
  timeout-minutes: 20
  strategy:
   fail-fast: false
   matrix: {api: [29, 35, 36]}
  steps:
   - uses: actions/checkout@v4
   - id: signed
     run: |
      node - <<'JS'
      const fs=require('fs'),r=JSON.parse(fs.readFileSync('warehouse-android/phone/release/receipt.json'));if(r.version==='1.0.6'&&fs.existsSync('warehouse-android/phone/release/'+r.file))fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');
      JS
   - uses: actions/download-artifact@v4
     if: steps.signed.outputs.ready == 'true'
     with: {name: fastgo-android-phone-verified, path: verify-package}
   - name: Check signed APK contains this commit's verified interface
     if: steps.signed.outputs.ready == 'true'
     run: |
      python3 - <<'PY'
      import json,zipfile
      expected=json.load(open('verify-package/src/main/assets/fastgo/bundle-receipt.json'))
      with zipfile.ZipFile('warehouse-android/phone/release/FastGo-Android-1.0.6.apk') as z:
       installed=json.loads(z.read('assets/fastgo/bundle-receipt.json'))
       assert installed['files']==expected['files'], 'Signed APK is older than verified source; sign the fresh package before publishing'
      PY
      python3 scripts/check-phone-apk-identity.py verify-package/build/outputs/apk/release/phone-release-unsigned.apk warehouse-android/phone/release/FastGo-Android-1.0.6.apk --output browser-results/android-phone-${{ matrix.api }}/apk-identity.json
   - uses: actions/setup-java@v4
     if: steps.signed.outputs.ready == 'true'
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     if: steps.signed.outputs.ready == 'true'
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     if: steps.signed.outputs.ready == 'true'
     with: {packages: platform-tools}
   - name: Enable KVM
     if: steps.signed.outputs.ready == 'true'
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     if: steps.signed.outputs.ready == 'true'
     env: {FASTGO_ANDROID_API: '${{ matrix.api }}'}
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: node scripts/check-phone-release.cjs
   - uses: actions/upload-artifact@v4
     if: always() && steps.signed.outputs.ready == 'true'
     with:
      name: fastgo-android-installed-${{ matrix.api }}
      path: browser-results/android-phone-${{ matrix.api }}/
 self-update-check:
  needs: verify
  runs-on: ubuntu-latest
  timeout-minutes: 20
  strategy:
   fail-fast: false
   matrix: {api: [29, 35, 36]}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/download-artifact@v4
     with: {name: fastgo-android-phone-verified, path: verify-package}
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     env: {FASTGO_ANDROID_API: '${{ matrix.api }}', FASTGO_SELFUPDATE_APK: 'verify-package/build/outputs/apk/debug/phone-debug.apk'}
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: node scripts/check-phone-self-update.cjs
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: fastgo-phone-self-update-${{ matrix.api }}
      path: browser-results/android-phone-${{ matrix.api }}/self-update/
 publish:
  if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.release-check.outputs.ready == 'true'
  needs: [verify, release-check, self-update-check]
  runs-on: ubuntu-latest
  permissions: {contents: write}
  steps:
   - uses: actions/checkout@v4
   - name: Require a signed package for this phone version
     id: package
     run: |
      node - <<'JS'
      const fs=require('fs'),r=JSON.parse(fs.readFileSync('warehouse-android/phone/release/receipt.json')),source=fs.readFileSync('warehouse-android/phone/build.gradle','utf8'),version=/versionName '([^']+)'/.exec(source)[1];if(r.version===version&&fs.existsSync('warehouse-android/phone/release/'+r.file))fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');else console.log('Phone source verified; a new signed phone release is not prepared. Keep the published APK.');
      JS
   - name: Publish only the installed and tested signed phone APK
     if: steps.package.outputs.ready == 'true'
     env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
     run: |
      node - <<'JS'
      const fs=require('fs'),crypto=require('crypto'),dir='warehouse-android/phone/release/',r=JSON.parse(fs.readFileSync(dir+'receipt.json','utf8'));
      if(crypto.createHash('sha256').update(fs.readFileSync(dir+r.file)).digest('hex')!==r.sha256)throw Error('Final APK hash mismatch');
      fs.writeFileSync(dir+'SHA256SUMS.txt',r.sha256+'  '+r.file+'\n');
      r.release_device_tests='passed: exact signed APK on Android 10 and 15 emulators';fs.writeFileSync(dir+'verified-receipt.json',JSON.stringify(r,null,2));
      JS
      tag=fastgo-android-v1.0.6
      if gh release view "$tag" >/dev/null 2>&1; then
        mkdir existing-phone-release
        gh release download "$tag" --pattern verified-receipt.json --dir existing-phone-release
        node - <<'JS'
      const fs=require('fs'),old=JSON.parse(fs.readFileSync('existing-phone-release/verified-receipt.json')),next=JSON.parse(fs.readFileSync('warehouse-android/phone/release/receipt.json'));if(old.sha256!==next.sha256)throw Error('This Android version already has different installed bytes. Increase versionName and versionCode.');
      JS
        exit 0
      fi
      gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title 'FastGo для Android 1.0.6' --notes 'Приложение для обычного телефона: сервис и просмотр склада. Подписанный APK проверен установкой и запуском, вводом текста, поворотом и перезапуском на Android 10 и 15 в эмуляторах. Вход через вашу учётную запись FastGo. Приход и кассовые операции сохраняют привязку к двум рабочим ноутбукам.' warehouse-android/phone/release/FastGo-Android-1.0.6.apk warehouse-android/phone/release/SHA256SUMS.txt warehouse-android/phone/release/verified-receipt.json

   - name: Publish automatic phone update channel after installed APK checks
     env: {GH_TOKEN: '${{ github.token }}'}
     run: node scripts/publish-phone-update.cjs
