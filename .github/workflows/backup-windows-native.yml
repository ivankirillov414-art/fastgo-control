name: FastGo backup Windows native gate
# Include the actual ASAR release manifests with the tested 75/64 installers.
on:
  push:
    paths: ['.github/workflows/backup-windows-native.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm,cache-dependency-path: desktop/package-lock.json}
      - name: Directed backup, space budget and update handoff checks
        run: node --test --test-isolation=none tests/backup-server.test.mjs tests/backup-replica.test.mjs tests/backup-daily-replica.test.mjs desktop/tests/backups.test.cjs desktop/tests/daily-backups.test.cjs warehouse-desktop/tests/backup-scheduler.test.cjs warehouse-desktop/tests/update-guard.test.cjs
      - run: npm ci
        working-directory: desktop
      - name: Supply official Android USB tools required by Windows packaging
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:RUNNER_TEMP/fastgo-adb.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/fastgo-adb.zip" -DestinationPath desktop
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/fastgo-adb.zip" -DestinationPath warehouse-desktop
      - name: Fetch pinned Electron through official release API and verify SHA256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content -Raw desktop/package.json | ConvertFrom-Json).devDependencies.electron
          $warehouseVersion=(Get-Content -Raw warehouse-desktop/package.json | ConvertFrom-Json).devDependencies.electron
          if($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $warehouseVersion){throw 'Both applications must use the same pinned Electron runtime'}
          $folder=Join-Path $env:RUNNER_TEMP 'fastgo-electron'
          $name="electron-v$version-win32-x64.zip"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          gh release download "v$version" --repo electron/electron --pattern $name --pattern SHASUMS256.txt --dir $folder
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $checks=@(Get-Content -LiteralPath (Join-Path $folder 'SHASUMS256.txt') | Where-Object {$_ -match ('^([a-f0-9]{64})\s+\*?'+[regex]::Escape($name)+'$')})
          if($checks.Count -ne 1){throw 'Official Electron checksum is missing or ambiguous'}
          $expected=($checks[0] -split '\s+')[0]
          $actual=(Get-FileHash -LiteralPath (Join-Path $folder $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw 'Official Electron SHA256 mismatch'}
          "FASTGO_ELECTRON_DIST=$folder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @{version=$version;name=$name;sha256=$actual;source="https://github.com/electron/electron/releases/tag/v$version"} | ConvertTo-Json | Set-Content -Encoding utf8 electron-runtime-source.json
      - name: Seed checksum-verified builder tools through the official release API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cache=Join-Path $env:RUNNER_TEMP 'fastgo-builder-cache'
          $tools=@(
            @{tag='nsis-3.0.4.1';name='nsis-3.0.4.1.7z';sha256='9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa'},
            @{tag='nsis-resources-3.4.1';name='nsis-resources-3.4.1.7z';sha256='593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103'},
            @{tag='7zip@1.0.0';name='7zip-win-x64.tar.gz';sha256='be071f15bd6da2f78fe81c6ddef2009b0c4d8a51f36b780cb806c7e6df95e1b3'}
          )
          foreach($tool in $tools){
            $folder=Join-Path $cache $tool.tag
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            gh release download $tool.tag --repo electron-userland/electron-builder-binaries --pattern $tool.name --dir $folder
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            $actual=(Get-FileHash -LiteralPath (Join-Path $folder $tool.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne $tool.sha256){throw ('Builder tool SHA256 mismatch: '+$tool.name)}
          }
          $tools | ConvertTo-Json | Set-Content -Encoding utf8 builder-toolchain-source.json
          $env:ELECTRON_BUILDER_CACHE=$cache
          "ELECTRON_BUILDER_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          const fs=require('node:fs'),path=require('node:path'),{createRequire}=require('node:module');
          const req=createRequire(path.resolve('desktop/package.json')),{Cache}=require(path.join(path.dirname(req.resolve('@electron/get')),'Cache.js'));
          (async()=>{const root=process.env.ELECTRON_BUILDER_CACHE,cache=new Cache(path.join(root,'downloads')),tools=JSON.parse(fs.readFileSync('builder-toolchain-source.json','utf8').replace(/^\uFEFF/,''));for(const tool of tools){const file=path.join(root,tool.tag,tool.name),copy=file+'.cache-seed';fs.copyFileSync(file,copy);await cache.putFileInCache('https://github.com/electron-userland/electron-builder-binaries/releases/download/'+tool.tag+'/'+tool.name,copy,tool.name);}console.log('Official builder archives seeded; upstream checksum validation remains enabled.');})().catch(error=>{console.error(error);process.exitCode=1;});
          '@ | node
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Build common Windows update candidate
        working-directory: desktop
        shell: pwsh
        run: npm run build -- "--config.electronDist=$env:FASTGO_ELECTRON_DIST"
      - name: Exercise packaged Electron SQLite and ASAR worker paths
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          & ./desktop/dist/win-unpacked/FastGo.exe ./scripts/check-backups-electron.cjs ./desktop/dist/win-unpacked/resources/app.asar | Tee-Object packaged-backup-runtime.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - run: npm ci
        working-directory: warehouse-desktop
      - name: Build standalone warehouse update candidate
        working-directory: warehouse-desktop
        shell: pwsh
        run: npm run build -- "--config.electronDist=$env:FASTGO_ELECTRON_DIST"
      - name: Exercise standalone warehouse ASAR worker
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE='1'
          $package=Get-Content -Raw warehouse-desktop/package.json | ConvertFrom-Json
          $name=if($package.build.executableName){$package.build.executableName}else{$package.build.productName}
          $exe=(Resolve-Path -LiteralPath (Join-Path 'warehouse-desktop/dist/win-unpacked' ($name+'.exe'))).Path
          & $exe ./scripts/check-backups-electron.cjs ./warehouse-desktop/dist/win-unpacked/resources/app.asar | Tee-Object packaged-warehouse-backup-runtime.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Record immutable candidate hashes
        shell: pwsh
        run: |
          $items=@()
          foreach($folder in @('desktop','warehouse-desktop')){
            $version=(Get-Content -Raw "$folder/package.json" | ConvertFrom-Json).version
            $files=Get-ChildItem -LiteralPath "$folder/dist" -File | Where-Object {$_.Name -match '\.(exe|blockmap|yml|json)$'}
            foreach($file in $files){$items += @{app=$folder;version=$version;name=$file.Name;bytes=$file.Length;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}}
          }
          @{status='PASS';source=$env:GITHUB_SHA;files=$items} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 windows-backup-candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-windows-native-evidence
          retention-days: 7
          path: |
            packaged-backup-runtime.txt
            packaged-warehouse-backup-runtime.txt
            electron-runtime-source.json
            builder-toolchain-source.json
            windows-backup-candidates.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: backup-windows-update-candidates
          retention-days: 7
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/dist/release-content.json
            warehouse-desktop/dist/*.exe
            warehouse-desktop/dist/*.blockmap
            warehouse-desktop/dist/latest.yml
            warehouse-desktop/dist/release-content.json
          if-no-files-found: error
