name: Shadow Army CI

on:
  push:
    branches: [shadow-army-v0.1]
    paths:
      - 'shadow-army/**'
      - '.github/workflows/shadow-army-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shadow_army
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow_army"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: shadow-army

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://shadow:shadow@localhost:5432/shadow_army
      PYTHONPATH: ${{ github.workspace }}/shadow-army

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shadow-army/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Seed E-rank shadows
        run: python -m app.seed
      - name: Run tests
        run: python -m pytest -q
      - name: Run PROJECT-001 end-to-end bootstrap
        run: python -m app.bootstrap_project | tee project-001-result.json
      - name: Verify API imports
        run: python -c "from app.main import app; assert app.title == 'Shadow Army Core'; print('API import OK')"
      - name: Upload PROJECT-001 result
        uses: actions/upload-artifact@v4
        with:
          name: shadow-army-project-001
          path: shadow-army/project-001-result.json
