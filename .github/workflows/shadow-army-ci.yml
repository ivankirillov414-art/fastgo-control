name: Shadow Army CI

on:
  push:
    branches: [shadow-army-v0.1]
    paths:
      - 'shadow-army/**'
      - '.github/workflows/shadow-army-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shadow_army
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow_army"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: shadow-army
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://shadow:shadow@localhost:5432/shadow_army
      PYTHONPATH: ${{ github.workspace }}/shadow-army
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shadow-army/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Seed E-rank shadows
        run: python -m app.seed
      - name: Run tests
        run: python -m pytest -q
      - name: Run PROJECT-001 end-to-end bootstrap
        run: python -m app.bootstrap_project | tee project-001-result.json
      - name: Verify API imports
        run: python -c "from app.main import app; assert app.title == 'Shadow Army Core'; print('API import OK')"
      - name: Validate committed Shadow Army artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('.')
          bad=[]
          placeholders=re.compile(r'(?i)(TODO|TBD|FIXME|lorem ipsum|placeholder|example\.com|требуется\s+заполн|нужно\s+заполн)')
          for p in root.rglob('*'):
            if not p.is_file() or any(x in p.parts for x in ('.git','__pycache__','.pytest_cache')): continue
            if p.suffix.lower() not in {'.html','.sql','.scad','.py','.js','.ts','.md'}: continue
            try: s=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            if p.suffix.lower() in {'.html','.sql','.scad','.py','.js','.ts'} and placeholders.search(s): bad.append(f'{p}: placeholder')
            if p.suffix.lower()=='.html':
              if not re.search(r'(?i)<!doctype html>',s) or not re.search(r'(?i)</html>\s*$',s): bad.append(f'{p}: malformed html')
              if not re.search(r'(?i)<meta[^>]+viewport',s): bad.append(f'{p}: missing viewport')
            if p.suffix.lower()=='.sql' and not re.search(r'(?i)\b(create|alter|insert|select|with)\b',s): bad.append(f'{p}: no SQL statement')
            if p.suffix.lower()=='.scad' and not re.search(r'\b(module|cube|cylinder|sphere|union|difference|intersection)\b',s): bad.append(f'{p}: no geometry')
          if bad:
            print('\n'.join(bad)); sys.exit(1)
          print('artifact static validation OK')
          PY
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Upload PROJECT-001 result
        uses: actions/upload-artifact@v4
        with:
          name: shadow-army-project-001
          path: shadow-army/project-001-result.json
