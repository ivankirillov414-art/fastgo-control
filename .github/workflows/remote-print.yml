name: Remote printing regression
on:
  push:
    paths:
      - 'workshop/print-*.js'
      - 'tests/remote-print.test.mjs'
      - 'tests/completion-print-db.test.mjs'
      - 'tests/completion-print-api.test.mjs'
      - 'tests/repair-act.test.mjs'
      - 'desktop/renderer/print-document.js'
      - 'desktop/renderer/completion-renderer.js'
      - 'supabase/functions/_shared/repair-act.js'
      - 'supabase/functions/fastgo-print-api/**'
      - 'supabase/functions/fastgo-warehouse/repair.js'
      - 'supabase/migrations/*repair_completion_print.sql'
      - 'print-station.html'
      - '.github/workflows/remote-print.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check workshop/print-client.js && node --check workshop/print-station.js && node --check workshop/core.js && node --check workshop/orders.js && node --check workshop/app.js && node --test tests/remote-print.test.mjs tests/completion-print-api.test.mjs tests/repair-act.test.mjs
      - name: Verify payment commit and completion print outbox in PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/print-db" --no-audit --no-fund @electric-sql/pglite@0.3.14
          FASTGO_PGLITE="$RUNNER_TEMP/print-db/node_modules/@electric-sql/pglite" node --test tests/completion-print-db.test.mjs
