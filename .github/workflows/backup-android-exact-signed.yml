name: FastGo exact signed Android backup update gates
on:
 push:
  branches: [codex/backup-seven-days-20261107]
  paths: ['scripts/check-native-apk-install.cjs','.github/workflows/backup-android-exact-signed.yml']
 workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
 release-check:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  strategy:
   fail-fast: false
   matrix: {api: [29, 35, 36]}
  steps:
   - uses: actions/checkout@v4
   - name: Require passing prerequisites and unchanged installed application code
     env: {GH_TOKEN: '${{ github.token }}'}
     run: |
      node - <<'JS'
      const cp=require('child_process'),source='a4f5fe9b37893eec3215f9e4f0ecec0162c06b05',run=42474888669,base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
      (async()=>{const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};const read=async path=>{const r=await fetch(base+path,{headers});if(!r.ok)throw Error('Prerequisite read '+r.status);return r.json();};
      const info=await read('/actions/runs/'+run);if(info.head_sha!==source)throw Error('Prerequisite source moved');const jobs=(await read('/actions/runs/'+run+'/jobs?per_page=100')).jobs;for(const name of ['verify',...['notice-check','self-update-check'].flatMap(n=>[29,35,36].map(api=>n+' ('+api+')'))])if(!jobs.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Mandatory prerequisite did not pass: '+name);
      cp.execFileSync('git',['fetch','--depth=1','origin',source],{stdio:'inherit'});cp.execFileSync('git',['diff','--quiet',source,'HEAD','--','warehouse-android','workshop','warehouse','workshop.html','workshop.css','warehouse.html','vendor','scripts/check-phone-release.cjs','scripts/check-phone-self-update.cjs','scripts/check-phone-apk-identity.py']);console.log('PASS: original build, notifications and self-update checks apply to identical installed app bytes and source');})().catch(e=>{console.error(e.message);process.exitCode=1;});
      JS
   - id: signed
     run: |
      node - <<'JS'
      const fs=require('fs'),r=JSON.parse(fs.readFileSync('warehouse-android/phone/release/receipt.json'));if(r.version==='1.0.17'&&fs.existsSync('warehouse-android/phone/release/'+r.file))fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');
      JS
   - uses: actions/download-artifact@v4
     if: steps.signed.outputs.ready == 'true'
     with: {name: fastgo-android-phone-verified, run-id: 42474888669, github-token: '${{ github.token }}', path: verify-package}
   - name: Check signed APK contains this commit's verified interface
     if: steps.signed.outputs.ready == 'true'
     run: |
      python3 - <<'PY'
      import json,zipfile
      expected=json.load(open('verify-package/src/main/assets/fastgo/bundle-receipt.json'))
      with zipfile.ZipFile('warehouse-android/phone/release/FastGo-Android-1.0.17.apk') as z:
       installed=json.loads(z.read('assets/fastgo/bundle-receipt.json'))
       assert installed==expected, 'Signed APK is older than verified source; sign the fresh package before publishing'
      PY
      python3 scripts/check-phone-apk-identity.py verify-package/build/outputs/apk/release/phone-release-unsigned.apk warehouse-android/phone/release/FastGo-Android-1.0.17.apk --output browser-results/android-phone-${{ matrix.api }}/apk-identity.json
   - name: Require exact signed TSD candidate and accepted unsigned source
     if: steps.signed.outputs.ready == 'true'
     id: tsd-source
     run: |
      node - <<'JS'
      const fs=require('fs'),crypto=require('crypto'),cp=require('child_process'),dir='warehouse-android/native/release/',r=JSON.parse(fs.readFileSync(dir+'receipt.json'));
      if(r.package!=='ru.fastgo.tsd.app'||r.versionCode!==13||r.versionName!=='2.1.10'||!Number.isSafeInteger(r.unsigned_run)||!(/^[a-f0-9]{40}$/.test(r.source_commit)))throw Error('Native candidate identity missing');
      for(const [file,sha]of [[r.file,r.sha256],[r.test_file,r.test_sha256]])if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==sha)throw Error('Native signed candidate bytes changed');
      cp.execFileSync('git',['fetch','--depth=1','origin',r.source_commit],{stdio:'inherit'});
      cp.execFileSync('git',['diff','--quiet',r.source_commit,'HEAD','--','warehouse-android/native/src/main','warehouse-android/native/build.gradle','warehouse-android/backup/src/main','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties']);
      fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+r.unsigned_run+'\n');
      JS
   - uses: actions/download-artifact@v4
     if: steps.signed.outputs.ready == 'true'
     with: {name: backup-tsd-unsigned-2.1.10, run-id: '${{ steps.tsd-source.outputs.run }}', github-token: '${{ github.token }}', path: verify-tsd-source}
   - name: Verify exact native APK body against unsigned CI artifact
     if: steps.signed.outputs.ready == 'true'
     run: |
      python3 - <<'PY'
      import glob,subprocess
      files=glob.glob('verify-tsd-source/**/native-release-unsigned.apk',recursive=True)
      assert len(files)==1, 'Native source APK missing or ambiguous'
      subprocess.run(['python3','scripts/check-phone-apk-identity.py',files[0],'warehouse/native/FastGo-TSD-2.1.10.apk','--output','browser-results/android-phone-${{ matrix.api }}/tsd-apk-identity.json'],check=True)
      PY
   - uses: actions/setup-java@v4
     if: steps.signed.outputs.ready == 'true'
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     if: steps.signed.outputs.ready == 'true'
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     if: steps.signed.outputs.ready == 'true'
     with: {packages: platform-tools}
   - name: Enable KVM
     if: steps.signed.outputs.ready == 'true'
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     if: steps.signed.outputs.ready == 'true'
     env:
      FASTGO_ANDROID_API: '${{ matrix.api }}'
      FASTGO_TSD_BASE_APK: warehouse/native/FastGo-TSD-2.1.9.apk
      FASTGO_TSD_CANDIDATE_APK: warehouse/native/FastGo-TSD-2.1.10.apk
      FASTGO_TSD_TEST_APK: warehouse-android/native/release/FastGo-TSD-2.1.10-upgrade-tests.apk
      FASTGO_TSD_EXPECTED_CODE: '13'
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      ram-size: 4096M
      disable-animations: true
      script: |
       node scripts/check-phone-release.cjs
       node scripts/check-native-apk-install.cjs
   - uses: actions/upload-artifact@v4
     if: always() && steps.signed.outputs.ready == 'true'
     with:
      name: fastgo-android-installed-${{ matrix.api }}-${{ github.run_attempt }}
      path: browser-results/android-phone-${{ matrix.api }}/
   - uses: actions/upload-artifact@v4
     if: always() && steps.signed.outputs.ready == 'true'
     with:
      name: fastgo-tsd-exact-signed-${{ matrix.api }}-${{ github.run_attempt }}
      path: warehouse-android/native/build/upgrade-test/
