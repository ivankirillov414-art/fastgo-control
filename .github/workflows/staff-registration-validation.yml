name: FastGo staff registration validation
on:
  push:
    branches: [codex/fastgo-staff-registration-20260925, codex/fastgo-account-device-20260925]
  pull_request:
    branches: [main]
    paths:
      - 'workshop/**'
      - 'workshop.html'
      - 'supabase/functions/fastgo-workshop-api/**'
      - 'supabase/workshop-schema.sql'
      - 'supabase/migrations/**'
      - 'tests/workshop-api.test.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check workshop/app.js
          node --check workshop/core.js
          node --check workshop/reset-password.js
      - name: Registration and workshop regression tests
        run: |
          node --test --test-name-pattern="non-admin cannot change staff|self-registration always creates a pending mechanic request|unconfirmed email cannot create an access request|admin cannot promote a member to owner|owner device enrollment is limited to iPhone|owner can bind the first iPhone as trusted device|owner password recovery requires the bound iPhone token|trusted owner iPhone may request password recovery|approved employee can request password recovery|owner login cannot be changed from the employee account form|approved employee can request login change" tests/workshop-api.test.mjs
          node --test tests/workshop-core.test.mjs tests/pending.test.mjs
