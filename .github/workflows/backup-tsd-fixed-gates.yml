name: FastGo fixed TSD signed bootstrap and own installer
on:
 push:
  branches: [codex/backup-seven-days-20261107]
  paths: ['.github/workflows/backup-tsd-fixed-gates.yml']
 workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
 exact:
  runs-on: ubuntu-latest
  timeout-minutes: 18
  strategy:
   fail-fast: false
   matrix: {api: [29, 35, 36]}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - name: Require exact signed bytes and unchanged unsigned input source
     id: source
     run: |
      node - <<'JS'
      const fs=require('fs'),cp=require('child_process'),crypto=require('crypto'),r=JSON.parse(fs.readFileSync('warehouse-android/native/release/receipt.json'));
      if(r.package!=='ru.fastgo.tsd.app'||r.versionCode!==13||r.versionName!=='2.1.10'||r.fixed_creator_opt_in!==true||r.fixture_version_code!==14)throw Error('Fixed native release receipt missing');
      for(const [file,sha]of [[r.file,r.sha256],[r.test_file,r.test_sha256],[r.fixture_file,r.fixture_sha256],[r.self_test_file,r.self_test_sha256]])if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==sha)throw Error('Signed native bytes changed');
      cp.execFileSync('git',['fetch','--depth=1','origin',r.source_commit],{stdio:'inherit'});cp.execFileSync('git',['diff','--quiet',r.source_commit,'HEAD','--','warehouse-android/native/src/main','warehouse-android/native/build.gradle','warehouse-android/backup/src/main','warehouse-android/build.gradle','warehouse-android/settings.gradle','warehouse-android/gradle.properties']);
      fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+r.unsigned_run+'\n');
      JS
   - uses: actions/download-artifact@v4
     with: {name: backup-tsd-fixed-unsigned-2.1.10, run-id: '${{ steps.source.outputs.run }}', github-token: '${{ github.token }}', path: unsigned-native}
   - name: Verify every APK content entry against accepted CI source
     run: |
      python3 scripts/check-phone-apk-identity.py unsigned-native/candidate13.apk warehouse/native/FastGo-TSD-2.1.10.apk --output warehouse-android/native/build/source-candidate13.json
      python3 scripts/check-phone-apk-identity.py unsigned-native/fixture14.apk warehouse-android/native/release/FastGo-TSD-2.1.10-self-update-fixture14.apk --output warehouse-android/native/build/source-fixture14.json
      python3 - <<'PY'
      import glob,subprocess
      jar=sorted(glob.glob('/usr/local/lib/android/sdk/build-tools/**/apksigner.jar',recursive=True))[-1]
      for apk in ['warehouse/native/FastGo-TSD-2.1.10.apk','warehouse-android/native/release/FastGo-TSD-2.1.10-upgrade-tests.apk','warehouse-android/native/release/FastGo-TSD-2.1.10-self-update-fixture14.apk','warehouse-android/native/release/FastGo-TSD-2.1.10-self-update-tests.apk']:
       result=subprocess.run(['java','-jar',jar,'verify','--verbose','--print-certs',apk],capture_output=True,text=True,check=True).stdout
       assert '72817ae5c97c8c60255ca3c029d4ecdd171ec0c33bc28a640e8c7ab0bdb637dd' in result
      PY
   - name: Read already passing bootstrap evidence for these exact bytes
     uses: actions/download-artifact@v4
     with: {name: 'backup-tsd-fixed-exact-${{ matrix.api }}-1', run-id: 42479054034, github-token: '${{ github.token }}', path: accepted-bootstrap}
   - name: Require accepted bootstrap retention without replaying it
     run: |
      python3 - <<'PY'
      import glob,json
      files=glob.glob('accepted-bootstrap/**/bootstrap-test/receipt.json',recursive=True);assert len(files)==1,files
      r=json.load(open(files[0]));candidate=json.load(open('warehouse-android/native/release/receipt.json'))
      assert r['api']==${{ matrix.api }} and r['from_code']==12 and r['to_code']==13 and r['sha256']==candidate['sha256']
      for key in ['exact_signed_candidate','android_uid_preserved','first_install_time_preserved','sqlite_retained','encrypted_value_retained','document_gate','installed_bytes_match']:assert r[key] is True,key
      print('PASS: prior exact12->13 bootstrap retention accepted; self-installer runs in a new isolated AVD')
      PY
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     env:
      FASTGO_ANDROID_API: '${{ matrix.api }}'
      FASTGO_TSD_BASE_APK: warehouse/native/FastGo-TSD-2.1.10.apk
      FASTGO_TSD_CANDIDATE_APK: warehouse-android/native/release/FastGo-TSD-2.1.10-self-update-fixture14.apk
      FASTGO_TSD_TEST_APK: warehouse-android/native/release/FastGo-TSD-2.1.10-self-update-tests.apk
      FASTGO_TSD_EXPECTED_CODE: '14'
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      ram-size: 4096M
      disk-size: 4096M
      disable-animations: true
      script: |
       adb shell svc wifi disable
       adb shell svc data disable
       node scripts/check-native-apk-install.cjs
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: backup-tsd-fixed-exact-${{ matrix.api }}-${{ github.run_attempt }}
      path: |
       warehouse-android/native/build/bootstrap-test/
       warehouse-android/native/build/upgrade-test/
       warehouse-android/native/build/source-*.json
