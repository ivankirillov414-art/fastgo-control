name: FastGo Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FastGo
        uses: actions/checkout@v4

      - name: Get FastGo release
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-release-feed"

          with urllib.request.urlopen(url) as response:
              manifest = json.load(response)

          for item in manifest.get("files", []):
              path = Path(item["path"])
              operation = item.get("operation", "put")

              if operation == "delete":
                  if path.exists():
                      path.unlink()
                  continue

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item.get("content", ""), encoding="utf-8")
          PY

      - name: Commit FastGo changes
        run: |
          git config user.name "FastGo Deploy"
          git config user.email "fastgo-deploy@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No FastGo changes"
            exit 0
          fi
          git commit -m "FastGo automated update"
          git push