name: FastGo Warehouse Apps
on:
 push:
  branches: [main]
  paths: ['warehouse-desktop/**','warehouse-android/**','warehouse/**','warehouse.html','warehouse-terminal.html','supabase/functions/fastgo-warehouse/**','supabase/functions/_shared/**','supabase/functions/fastgo-operations/**','tests/preorders.test.mjs','tests/master-stock.test.mjs','tests/operations.test.mjs','tests/warehouse*.mjs','scripts/build-warehouse-web.cjs','scripts/check-warehouse*.cjs','workshop/photo-upload.js','workshop/private-photo.js','workshop/product-intake.js','workshop/inventory-ui.js','.github/workflows/warehouse-apps.yml','!warehouse/update/**']
 pull_request:
  paths: ['warehouse-desktop/**','warehouse/**','warehouse*.html','supabase/functions/fastgo-warehouse/**','supabase/functions/_shared/**','supabase/functions/fastgo-operations/**','tests/preorders.test.mjs','tests/master-stock.test.mjs','tests/operations.test.mjs','tests/warehouse*.mjs','scripts/build-warehouse-web.cjs','workshop/photo-upload.js','workshop/private-photo.js','workshop/product-intake.js','workshop/inventory-ui.js','scripts/check-warehouse*.cjs','.github/workflows/warehouse-apps.yml']
 workflow_dispatch:
permissions:
 contents: write
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: node scripts/build-warehouse-web.cjs --check
   - run: node --test tests/preorders.test.mjs tests/warehouse*.mjs tests/device-updates.test.mjs tests/parts-pickup.test.mjs tests/customer-repair-status.test.mjs tests/native-store.test.mjs tests/master-stock.test.mjs tests/operations.test.mjs tests/avito.test.mjs tests/backup-replica.test.mjs tests/backup-server.test.mjs desktop/tests/barcode-print.test.cjs desktop/tests/avito-toast.test.cjs
   - run: node --test warehouse-desktop/tests/*.test.cjs desktop/tests/printer-profiles.test.cjs
   - run: npm install --prefix /tmp/warehouse-browser playwright@1.62.1
   - run: /tmp/warehouse-browser/node_modules/.bin/playwright install --with-deps chromium
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-unified-warehouse-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-usb-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-live-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-receipt-labels-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-receipt-cancel-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-payment-cancel-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-auto-open-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-safe-refresh-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-network-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-product-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-catalog-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-part-photo-cache.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-price-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-workshop-sale-price-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-workshop-equipment-price-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-master-stock-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-native-unknown-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-payment-scanner-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-barcode-print.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-printer-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-preorders-browser.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-customer-qr-routing.cjs
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-avito-notifications.cjs
 windows:
  runs-on: windows-latest
  timeout-minutes: 12
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: npm ci
     working-directory: warehouse-desktop
   - name: Bundle official Android USB tools
     shell: pwsh
     run: |
      Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile adb.zip
      Expand-Archive adb.zip -DestinationPath warehouse-desktop
   - name: Verify the signed P2 driver registers through native Windows tools
     timeout-minutes: 4
     shell: pwsh
     run: ./warehouse-desktop/tests/p2-driver-install.ps1
   - name: Verify the signed PC365 driver registers through native Windows tools
     timeout-minutes: 4
     shell: pwsh
     run: ./warehouse-desktop/tests/pc365-driver-install.ps1
   - run: npm run build
     working-directory: warehouse-desktop
   - name: Install desktop verification tools
     shell: pwsh
     run: |
      npm install --prefix "$env:RUNNER_TEMP/warehouse-playwright" playwright@1.62.1
      "FASTGO_PLAYWRIGHT=$env:RUNNER_TEMP/warehouse-playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
   - name: Verify bundled warehouse UI without internet
     timeout-minutes: 2
     run: node scripts/check-warehouse-bundled-desktop.cjs
   - name: Verify photo cache persists after native restart
     shell: pwsh
     run: |
      $env:FASTGO_ELECTRON = Join-Path $pwd 'warehouse-desktop/node_modules/electron/dist/electron.exe'
      node scripts/check-part-photo-cache-native.cjs
   - name: Verify native Windows network probe
     timeout-minutes: 1
     run: node warehouse-desktop/tests/network-windows-probe.cjs
   - name: Verify installed warehouse assets without internet
     timeout-minutes: 3
     run: node warehouse-desktop/check-package.cjs
   - name: Verify in-place upgrade and correct Russian installation name
     shell: pwsh
     run: ./warehouse-desktop/tests/installer-upgrade.ps1
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: warehouse-windows
      path: |
       warehouse-desktop/dist/*.exe
       warehouse-desktop/dist/*.exe.blockmap
       warehouse-desktop/dist/latest.yml
       warehouse-desktop/dist/warehouse-package-verification.json
       warehouse-desktop/dist/warehouse-window.png
       warehouse-desktop/dist/warehouse-printer-window.png
       warehouse-desktop/dist/network-window.png
       warehouse-desktop/dist/warehouse-upgrade-verification.json
 android:
  if: github.event_name != 'pull_request'
  needs: test
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Package the verified in-place TSD update
     run: |
      mkdir -p warehouse-android/release
      python3 - <<'PY'
      import json,hashlib,pathlib,shutil
      c=json.load(open('warehouse/native-update.json'))['channels']['ru.fastgo.tsd.app']
      p=pathlib.Path('warehouse/native')/pathlib.Path(c['url']).name
      assert hashlib.sha256(p.read_bytes()).hexdigest()==c['sha256']
      shutil.copy2(p,pathlib.Path('warehouse-android/release')/p.name)
      PY
   - uses: actions/upload-artifact@v4
     with: {name: warehouse-android, path: warehouse-android/release/*.apk}

 publish:
  if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
  needs: [test,windows,android]
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/download-artifact@v4
     with: {name: warehouse-windows, path: warehouse-release}
   - uses: actions/download-artifact@v4
     with: {name: warehouse-android, path: warehouse-release}
   - name: Publish separate warehouse release without replacing workshop updater
     env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
     run: |
      version=$(node -p "require('./warehouse-desktop/package.json').version")
      tag="fastgo-warehouse-v$version"
      if gh release view "$tag" >/dev/null 2>&1; then
        echo "This tested version is already published; keep its original binaries and feed."
        exit 0
      fi
      (cd warehouse-release && zip -9 "FastGo-Warehouse-Setup-${version}-Windows-x64.zip" "FastGo-Warehouse-Setup-${version}-Windows-x64.exe")
      gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "FastGo Склад и Терминал $version" --notes 'Сканирование строго по разделам: ремонтные QR только в оплате ремонта, QR мастера в выдаче запчастей, товарные коды в приходе и продаже. Ошибочные сканы не создают очередь. Нативный ТСД 2.1.6 обновляется поверх установленного приложения с сохранением данных.' warehouse-release/*.exe warehouse-release/*.zip warehouse-release/*.exe.blockmap warehouse-release/latest.yml warehouse-release/*.apk
      python3 scripts/publish-warehouse-feed.py
