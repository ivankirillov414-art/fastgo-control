name: FastGo Warehouse Apps
on:
 push:
  branches: [main]
  paths: ['warehouse-desktop/**','warehouse-android/**','warehouse/**','warehouse.html','warehouse-terminal.html','supabase/functions/fastgo-warehouse/**','tests/warehouse*.mjs','.github/workflows/warehouse-apps.yml','!warehouse/update/**']
 workflow_dispatch:
permissions:
 contents: write
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: node --test tests/warehouse*.mjs tests/native-store.test.mjs
   - run: npm install --prefix /tmp/warehouse-browser playwright@1.62.1
   - run: /tmp/warehouse-browser/node_modules/.bin/playwright install --with-deps chromium
   - run: NODE_PATH=/tmp/warehouse-browser/node_modules node scripts/check-warehouse-browser.cjs
 windows:
  needs: test
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: npm ci
     working-directory: warehouse-desktop
   - name: Bundle official Android USB tools
     shell: pwsh
     run: |
      Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile adb.zip
      Expand-Archive adb.zip -DestinationPath warehouse-desktop
   - run: npm run build
     working-directory: warehouse-desktop
   - uses: actions/upload-artifact@v4
     with:
      name: warehouse-windows
      path: |
       warehouse-desktop/dist/*.exe
       warehouse-desktop/dist/*.exe.blockmap
       warehouse-desktop/dist/latest.yml
 android:
  needs: test
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Reuse verified signed terminal APK
     env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
     run: |
      mkdir -p warehouse-android/app/build/outputs/apk/debug
      gh release download fastgo-warehouse-v1.0.1 --pattern FastGo-Terminal-1.0.1-test.apk --dir /tmp/terminal
      echo '2f4059cab05592dbd84e98908e646944ee8728c913510a080858347e4e345d31  /tmp/terminal/FastGo-Terminal-1.0.1-test.apk' | sha256sum -c -
      cp /tmp/terminal/FastGo-Terminal-1.0.1-test.apk warehouse-android/app/build/outputs/apk/debug/app-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: warehouse-android, path: warehouse-android/app/build/outputs/apk/debug/app-debug.apk}
 publish:
  needs: [windows,android]
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/download-artifact@v4
     with: {name: warehouse-windows, path: warehouse-release}
   - uses: actions/download-artifact@v4
     with: {name: warehouse-android, path: warehouse-release}
   - name: Publish separate warehouse release without replacing workshop updater
     env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
     run: |
      version=$(node -p "require('./warehouse-desktop/package.json').version")
      tag="fastgo-warehouse-v$version"
      if gh release view "$tag" >/dev/null 2>&1; then
        echo "This tested version is already published; keep its original binaries and feed."
        exit 0
      fi
      mv warehouse-release/app-debug.apk "warehouse-release/FastGo-Terminal-1.0.1-test.apk"
      gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "FastGo Склад и Терминал $version" --notes 'Отдельное складское рабочее место Windows и тестовый Android APK. APK требует проверки клавиатурного режима сканера на iData. Учёт оплат не заменяет фискальный чек / банковский платёж.' warehouse-release/*.exe warehouse-release/*.exe.blockmap warehouse-release/latest.yml "warehouse-release/FastGo-Terminal-1.0.1-test.apk"
      python3 scripts/publish-warehouse-feed.py
