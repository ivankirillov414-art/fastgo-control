name: FastGo Windows
on:
  push:
    paths: ['desktop/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run prepare-web
        working-directory: desktop
      - name: Install desktop smoke test driver
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/fastgo-playwright" playwright@1.62.1
      - name: Exercise offline desktop UI and restart
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/smoke.cjs
      - name: Verify stable screen during background polling
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/ui-stability.cjs
      - run: npm run build
        working-directory: desktop
      - name: Verify packaged update support
        run: node desktop/tests/check-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: FastGo-Windows
          path: |
            desktop/dist/FastGo-Setup-*-Windows-x64.exe
            desktop/dist/FastGo-Setup-*-Windows-x64.exe.blockmap
            desktop/dist/latest.yml
            desktop/README.md
          if-no-files-found: error
          retention-days: 90
