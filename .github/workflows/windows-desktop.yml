name: FastGo Windows
on:
  push:
    paths: ['desktop/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FastGo-Windows
          path: |
            desktop/dist/FastGo-Setup-*-Windows-x64.exe
            desktop/README.md
          if-no-files-found: error
          retention-days: 90
