name: FastGo Windows
on:
  push:
    paths: ['scripts/windows-release-order.cjs', 'tests/windows-release-order.test.cjs', '.github/workflows/publish-windows-installer.yml', 'scripts/release-content.cjs', 'tests/release-content.test.cjs', 'desktop/**', 'warehouse/**', 'warehouse-desktop/**', 'warehouse.html', 'workshop/**', 'workshop.html', 'workshop.css', 'scripts/fullscreen-smoke.cjs', 'tests/native-sync.test.mjs', 'supabase/functions/_shared/native-sync.js', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - name: Bundle official Android USB tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:RUNNER_TEMP/fastgo-adb.zip"
          Expand-Archive "$env:RUNNER_TEMP/fastgo-adb.zip" -DestinationPath desktop
      - run: npm test
        working-directory: desktop
      - name: Verify PC365 media recovery with Windows PowerShell 5.1
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File warehouse-desktop/tests/pc365-media-windows.ps1
      - name: Verify incremental sync metadata and access checks
        run: node --test tests/windows-release-order.test.cjs tests/release-content.test.cjs tests/preorders.test.mjs tests/native-sync.test.mjs tests/update-safety.test.mjs tests/owner-overview.test.mjs tests/repair-progress.test.mjs tests/native-store.test.mjs tests/backup-replica.test.mjs tests/backup-server.test.mjs
      - run: npm run prepare-web
        working-directory: desktop
      - name: Install desktop smoke test driver
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/fastgo-playwright" playwright@1.62.1 pdf-lib@1.17.1
      - name: Exercise offline desktop UI and restart
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/smoke.cjs
      - name: Verify the warehouse inside the common app
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/unified-smoke.cjs
          node desktop/tests/terminal-auto-open.cjs
      - name: Verify repair receipt fits one A4 page
        # Photo cache must survive the same native origin and process restart.
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/print-layout.cjs
      - name: Verify native photo cache persistence
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node scripts/check-part-photo-cache-native.cjs
      - name: Verify stable screen during background polling
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/ui-stability.cjs
      - name: Verify manual update progress and safe restart
        shell: pwsh
        run: |
          $env:FASTGO_PLAYWRIGHT = "$env:RUNNER_TEMP/fastgo-playwright"
          node desktop/tests/update-progress.cjs
      - run: npm run build
        working-directory: desktop
      - name: Verify packaged update support
        run: node desktop/tests/check-package.cjs
      - name: Exercise visible installer progress and automatic relaunch
        shell: pwsh
        run: ./desktop/tests/installer-progress.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastGo-update-progress-screenshots
          path: desktop/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FastGo-Windows
          path: |
            desktop/dist/FastGo-Setup-*-Windows-x64.exe
            desktop/dist/FastGo-Setup-*-Windows-x64.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/release-content.json
            desktop/README.md
          if-no-files-found: error
          retention-days: 90
