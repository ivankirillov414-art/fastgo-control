name: FastGo Warehouse Launcher
on:
  push:
    branches: [codex/warehouse-launcher-1.0.2]
    paths: ['launcher/**', '.github/workflows/warehouse-launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/warehouse-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable native launcher
        shell: pwsh
        run: ./launcher/build.ps1
      - name: Verify downloader and trusted channel
        shell: pwsh
        run: |
          ./launcher/dist/Launcher.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Downloader verification failed' }
      - name: Verify embedded JARVIS fix with isolated fixtures
        shell: powershell
        run: ./launcher/repair/Tests.ps1
      - name: Verify hidden PowerShell result and error transport
        shell: powershell
        run: ./launcher/repair/Transport.Tests.ps1
      - name: Verify P2 setup with isolated printer and installer fixtures
        shell: powershell
        run: ./launcher/repair/Printer.Tests.ps1
      - name: Verify final EXE and network diagnostics
        shell: pwsh
        run: |
          $taskProof = Join-Path $PWD 'launcher/dist/verification'
          $taskApp = Start-Process -FilePath './launcher/dist/FastGo-Warehouse-Launcher.exe' -ArgumentList @('--ui-smoke',('"' + $taskProof + '"')) -PassThru -WindowStyle Hidden
          if (!$taskApp.WaitForExit(150000)) { Stop-Process -Id $taskApp.Id; throw 'Native launcher smoke test timed out' }
          if ($taskApp.ExitCode -ne 0) { throw 'Native launcher failed' }
          $taskState = Get-Content -LiteralPath (Join-Path $taskProof 'ui-verification.json') -Raw | ConvertFrom-Json
          if (!$taskState.native_process -or !$taskState.download_button_enabled -or !$taskState.jarvis_resource_embedded -or !$taskState.jarvis_runner_embedded -or !$taskState.jarvis_error_code_visible -or !$taskState.jarvis_button_enabled -or $taskState.network_checks -lt 7 -or $taskState.network_errors -ne 0) { throw 'Final EXE or network verification failed' }
          if (!$taskState.printer_resource_embedded -or !$taskState.printer_button_enabled -or !$taskState.printer_inspection_readonly -or $taskState.printer_inspection_status -notin @('ready','driver_installed','not_connected')) { throw 'Final EXE printer inspection failed' }
          if ((Get-Item './launcher/dist/FastGo-Warehouse-Launcher.exe').Length -gt 200000) { throw 'Portable launcher exceeds size budget' }
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse-launcher-proof
          path: |
            launcher/dist/FastGo-Warehouse-Launcher.exe
            launcher/dist/SHA256SUMS.txt
            launcher/dist/verification/
      - name: Publish launcher download
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/warehouse-launcher-1.0.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskTag = 'fastgo-launcher-v1.0.2'
          gh release view $taskTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Immutable launcher release already exists' }
          @'
          Переносимый лаунчер FastGo Склад для Windows 10/11.

          Докачка после обрыва, проверка SHA-512, прогресс и скорость загрузки,
          диагностика сети и сохранение отчёта. Установка склада запускается по кнопке.
          Встроена кнопка «Убрать окна JARVIS» для кассового ноутбука.

          В версии 1.0.2 добавлена кнопка «Подключить термопринтер P2».
          Она проверяет очереди Windows и драйвер DETONGER P2, при необходимости
          скачивает и проверяет официальный драйвер перед запросом прав Windows.
          Установка запускается по кнопке. Общая блокировка со складом защищает от
          одновременного запуска двух установок. Физическая печать проверяется отдельно.

          Скачать FastGo-Warehouse-Launcher.exe и запустить. Установка лаунчера не требуется.
          Проверки загрузчика, исправления JARVIS и готового Windows EXE пройдены.
          Применение исправления на физической кассе выполняется пользователем отдельно.
          '@ | Set-Content -LiteralPath './launcher/dist/release-notes.txt' -Encoding utf8
          gh release create $taskTag './launcher/dist/FastGo-Warehouse-Launcher.exe' './launcher/dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'FastGo Склад — лаунчер 1.0.2, подключение термопринтера P2' --notes-file './launcher/dist/release-notes.txt' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Launcher release publication failed' }
