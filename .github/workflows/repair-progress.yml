name: Repair progress checks
on:
  push:
    branches: [main]
    paths: ['workshop/**', 'workshop.html', 'scripts/check-repair-progress.cjs', 'scripts/check-mobile-intake.cjs', 'tests/repair-progress.test.mjs', '.github/workflows/repair-progress.yml']
  pull_request:
    paths: ['workshop/**', 'workshop.html', 'scripts/check-repair-progress.cjs', 'scripts/check-mobile-intake.cjs', 'tests/repair-progress.test.mjs', '.github/workflows/repair-progress.yml']
permissions:
  contents: read
jobs:
  repair-progress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/repair-progress.test.mjs tests/native-store.test.mjs tests/repair-parts.test.mjs
      - run: npm install --prefix /tmp/fastgo-progress playwright@1.62.1
      - run: /tmp/fastgo-progress/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: FASTGO_REPAIR_BROWSER=${{ matrix.browser }} NODE_PATH=/tmp/fastgo-progress/node_modules node scripts/check-repair-progress.cjs
      - if: matrix.browser == 'chromium'
        run: NODE_PATH=/tmp/fastgo-progress/node_modules node scripts/check-repair-step-flow.cjs
      - run: FASTGO_REPAIR_BROWSER=${{ matrix.browser }} NODE_PATH=/tmp/fastgo-progress/node_modules node scripts/check-mobile-intake.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-progress-screenshots-${{ matrix.browser }}
          path: browser-results/
