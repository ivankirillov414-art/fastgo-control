name: FastGo autonomous validation
on:
  push:
    branches: [codex/fastgo-autonomous-finish]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source edits
        run: python scripts/apply-autonomous-fixes.py
      - name: Syntax and regression tests
        run: |
          for f in workshop/*.js; do node --check "$f"; done
          node --test tests/google-cutover.test.mjs tests/google-reliability.test.mjs tests/pending.test.mjs tests/workshop-core.test.mjs tests/inventory-import.test.mjs tests/library-loader.test.mjs tests/barcode.test.mjs
      - name: Commit verified edits on review branch only
        run: |
          git config user.name 'FastGo release'
          git config user.email 'fastgo-deploy@users.noreply.github.com'
          git add workshop/ workshop.html google-apps-script/ tests/ supabase/functions/fastgo-workshop-api/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix import replay, response validation, scanner errors and Google source validation'
            git push origin HEAD:codex/fastgo-autonomous-finish
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fastgo-reviewed-sources
          path: |
            google-apps-script/
            workshop/
            tests/
            vendor/
            supabase/functions/fastgo-workshop-api/
            workshop.html
            workshop.css
          retention-days: 3
