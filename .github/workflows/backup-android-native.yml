name: FastGo backup Android native gate
on:
  push:
    paths: ['.github/workflows/backup-android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Directed backup policy and minimum API compilation
        run: node scripts/check-android-backups.cjs
      - name: Prepare actual phone assets
        run: node warehouse-android/phone/prepare-web.cjs
      - name: Compile actual phone and TSD plus isolated runtime tests
        working-directory: warehouse-android
        run: gradle :phone:assembleDebug :phone:assembleDebugAndroidTest :native:assembleDebug :native:assembleDebugAndroidTest :phone:lintRelease -PfastgoPhoneApiAudit=true --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One isolated Android 6 runtime for backup jobs, keys, SQLite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r warehouse-android/phone/build/outputs/apk/debug/phone-debug.apk
            adb install -r warehouse-android/phone/build/outputs/apk/androidTest/debug/phone-debug-androidTest.apk
            adb shell am instrument -w -e class ru.fastgo.mobile.BackupRuntimeTest ru.fastgo.mobile.test.test/androidx.test.runner.AndroidJUnitRunner > phone-backup-runtime.txt
            cat phone-backup-runtime.txt
            node -e "const t=require('fs').readFileSync('phone-backup-runtime.txt','utf8');if(!/OK \(2 tests\)/.test(t)||/FAILURES|INSTRUMENTATION_FAILED|Process crashed/.test(t))process.exit(1)"
            adb install -r warehouse-android/native/build/outputs/apk/debug/native-debug.apk
            adb install -r warehouse-android/native/build/outputs/apk/androidTest/debug/native-debug-androidTest.apk
            adb shell am instrument -w -e class ru.fastgo.tsd.BackupRuntimeTest ru.fastgo.tsd.app.test/androidx.test.runner.AndroidJUnitRunner > tsd-backup-runtime.txt
            cat tsd-backup-runtime.txt
            node -e "const t=require('fs').readFileSync('tsd-backup-runtime.txt','utf8');if(!/OK \(1 test\)/.test(t)||/FAILURES|INSTRUMENTATION_FAILED|Process crashed/.test(t))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-android-native-evidence
          path: |
            *-backup-runtime.txt
            warehouse-android/backup/build/check/result.json
            warehouse-android/phone/build/reports/lint-results-release.*
          if-no-files-found: warn
