name: FastGo public channel auto-update audit
on:
 pull_request:
  paths: ['.github/workflows/phone-public-update.yml','scripts/audit-phone-auto-update.cjs']
 workflow_dispatch:
permissions: {contents: read}
jobs:
 public-auto-update:
  runs-on: ubuntu-latest
  timeout-minutes: 15
  strategy:
   fail-fast: false
   matrix: {api: [29, 35, 36]}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools}
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     env: {FASTGO_ANDROID_API: '${{ matrix.api }}'}
     with:
      api-level: ${{ matrix.api }}
      arch: x86_64
      profile: Nexus 5
      disable-animations: true
      script: node scripts/audit-phone-auto-update.cjs
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: phone-public-update-${{ matrix.api }}
      path: browser-results/phone-public-auto-update-${{ matrix.api }}/
