<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070a"><title>FastGo OS — Achievements</title><style>:root{--bg:#05070a;--p:#10151c;--p2:#0a0e13;--line:#25303b;--t:#f1f5f9;--m:#8d9aaa;--a:#b8ff35;--d:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#16200e 0,#080b0f 30%,var(--bg) 65%);color:var(--t);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}header{padding:22px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#05070ae8;backdrop-filter:blur(14px);z-index:3}.logo{font-weight:900;font-size:23px}.logo b{color:var(--a)}main{max-width:1180px;margin:auto;padding:28px 5%}.top{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.top h1{margin:0 auto 0 0;font-size:28px}button,input,select{font:inherit;border-radius:11px;padding:11px 12px;border:1px solid #344252;background:#0c1117;color:white}button{background:var(--a);color:#11170a;border:0;font-weight:800;cursor:pointer}.secondary{background:#202a34;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{background:linear-gradient(145deg,#121922,#0b1016);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 15px 45px #0005}.head{display:flex;gap:10px;align-items:start}.head h3{margin:0;flex:1}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#26313c;color:#b8c2ce}.muted{color:var(--m)}.nums{display:flex;justify-content:space-between;margin:18px 0 8px}.nums strong{font-size:23px}.bar{height:8px;background:#222b34;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:10px}.timers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.timer{background:var(--p2);border:1px solid #202a34;border-radius:12px;padding:10px}.timer b{display:block;margin-top:4px;font-size:13px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.danger{background:#3a2023;color:#ff9c9c}dialog{width:min(520px,92vw);border:1px solid var(--line);border-radius:18px;background:#10151c;color:white;padding:20px}dialog::backdrop{background:#000b}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;color:var(--m)}.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{grid-column:1/-1;text-align:center;padding:50px;border:1px dashed #2b3540;border-radius:18px;color:var(--m)}@media(max-width:600px){.timers,.form .two{grid-template-columns:1fr}.top h1{width:100%}}</style></head><body><header><div class="logo">FAST<b>GO</b> OS</div><span class="muted">ACHIEVEMENTS</span></header><main><div class="top"><h1>Мои достижения</h1><button onclick="openForm()">+ Достижение</button><button class="secondary" onclick="location.href='index.html'">FastGo Control</button></div><div id="grid" class="grid"></div></main><dialog id="dlg"><form id="form" class="form"><h2 id="formTitle">Новое достижение</h2><input id="editId" type="hidden"><label>Название<input id="title" required placeholder="Например: Накопить на переезд"></label><label>Описание<input id="desc" placeholder="Короткое пояснение"></label><div class="two"><label>Сейчас<input id="current" type="number" min="0" value="0" required></label><label>Цель<input id="target" type="number" min="1" value="100" required></label></div><div class="two"><label>Дата начала<input id="start" type="datetime-local" required></label><label>Дедлайн<input id="deadline" type="datetime-local" required></label></div><label>Статус<select id="status"><option>В процессе</option><option>Запланировано</option><option>Выполнено</option></select></label><div class="actions"><button type="submit">Сохранить</button><button type="button" class="secondary" onclick="dlg.close()">Отмена</button></div></form></dialog><script>const KEY='fastgo_achievements_v1';const $=id=>document.getElementById(id);const dlg=$('dlg');let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:crypto.randomUUID(),title:'Первое достижение',desc:'Добавь свои реальные цели через кнопку сверху',current:1,target:4,start:new Date().toISOString(),deadline:new Date(Date.now()+30*864e5).toISOString(),status:'В процессе'}];function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))}function duration(ms){const neg=ms<0;ms=Math.abs(ms);const d=Math.floor(ms/864e5);const h=Math.floor(ms/36e5)%24;const m=Math.floor(ms/6e4)%60;const s=Math.floor(ms/1000)%60;return(neg?'− ':'')+`${d}д ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function render(){const g=$('grid');if(!data.length){g.innerHTML='<div class="empty">Пока нет достижений. Создай первое.</div>';return}g.innerHTML=data.map(x=>{const p=Math.max(0,Math.min(100,x.target?x.current/x.target*100:0));return`<article class="card"><div class="head"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.status)}</span></div><p class="muted">${esc(x.desc)}</p><div class="nums"><strong>${esc(x.current)} / ${esc(x.target)}</strong><span>${Math.round(p)}%</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="timers"><div class="timer"><span class="muted">Прошло</span><b data-elapsed="${x.id}">—</b></div><div class="timer"><span class="muted">Осталось</span><b data-left="${x.id}">—</b></div></div><div class="actions"><button class="secondary" onclick="editGoal('${x.id}')">Изменить</button><button class="danger" onclick="removeGoal('${x.id}')">Удалить</button></div></article>`}).join('');tick()}function tick(){const now=Date.now();data.forEach(x=>{const e=document.querySelector(`[data-elapsed="${x.id}"]`),l=document.querySelector(`[data-left="${x.id}"]`);if(e)e.textContent=duration(now-new Date(x.start).getTime());if(l)l.textContent=x.status==='Выполнено'?'Выполнено':duration(new Date(x.deadline).getTime()-now)})}function localDT(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}function openForm(){form.reset();$('editId').value='';$('current').value=0;$('target').value=100;$('start').value=localDT(new Date());$('deadline').value=localDT(new Date(Date.now()+30*864e5));$('formTitle').textContent='Новое достижение';dlg.showModal()}function editGoal(id){const x=data.find(a=>a.id===id);if(!x)return;$('editId').value=x.id;$('title').value=x.title;$('desc').value=x.desc;$('current').value=x.current;$('target').value=x.target;$('start').value=localDT(new Date(x.start));$('deadline').value=localDT(new Date(x.deadline));$('status').value=x.status;$('formTitle').textContent='Редактировать достижение';dlg.showModal()}function removeGoal(id){if(confirm('Удалить достижение?')){data=data.filter(x=>x.id!==id);save()}}form.onsubmit=e=>{e.preventDefault();const id=$('editId').value||crypto.randomUUID();const item={id,title:$('title').value.trim(),desc:$('desc').value.trim(),current:Number($('current').value),target:Number($('target').value),start:new Date($('start').value).toISOString(),deadline:new Date($('deadline').value).toISOString(),status:$('status').value};const i=data.findIndex(x=>x.id===id);if(i>=0)data[i]=item;else data.unshift(item);save();dlg.close()};render();setInterval(tick,1000)</script></body></html>
