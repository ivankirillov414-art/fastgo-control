<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030308"><title>Personal RPG</title><style>:root{--v:#925cff;--m:#888096}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030308;color:#f7f3ff;font-family:system-ui,-apple-system,sans-serif}body{background-image:radial-gradient(circle at 12% 17%,#9869ff99 0 1px,transparent 1.4px),radial-gradient(circle at 73% 31%,#ffffff44 0 1px,transparent 1.4px),radial-gradient(circle at 44% 78%,#7e50e666 0 1px,transparent 1.4px);background-size:149px 163px,211px 197px,263px 229px}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:18px;letter-spacing:.12em;margin:0}.ghost{border:1px solid #ffffff18;background:#0e0b18;color:#cfc7db;border-radius:12px;padding:10px 13px}.hero{text-align:center;padding:22px 0 14px}.core{width:126px;height:126px;margin:auto;border-radius:50%;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 38% 32%,#c9aaff,#7741e7 42%,#2b125d 70%,#0d0719);box-shadow:0 0 35px #7d45ff,0 0 100px #6731d955;border:1px solid #bb93ff}.core small{font-size:10px;letter-spacing:.18em}.core strong{font-size:35px}.xp{width:220px;margin:15px auto 0}.bar{height:7px;border-radius:10px;background:#191525;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7040e5,#b77cff);box-shadow:0 0 10px #925cff;transition:.4s}.xptext{font-size:11px;color:var(--m);margin-top:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{border:1px solid #925cff32;background:#0c0915d9;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;color:#c9adff}.stat span{font-size:10px;color:#9a92a7}.sectiontitle{display:flex;justify-content:space-between;align-items:end;margin:26px 2px 12px}.sectiontitle h2{font-size:18px;margin:0}.sectiontitle span{font-size:11px;color:var(--m)}.skill{border:1px solid #925cff42;border-radius:18px;background:linear-gradient(135deg,#17112ae8,#090812e8);padding:16px}.skillhead{display:flex;justify-content:space-between}.skill h3{margin:0;font-size:16px}.rank{color:#b78aff;font-size:12px}.skill p{font-size:12px;color:var(--m);margin:8px 0 12px}.tree{margin-top:18px;padding:8px 4px}.chapter{font-size:10px;color:#8f62e8;letter-spacing:.14em;margin:23px 0 10px}.node{position:relative;margin:0 auto 14px;width:94%;padding:13px 14px 13px 40px;border:1px solid #42325e;background:#0b0912;border-radius:14px;transition:.25s}.node:before{content:'';position:absolute;left:18px;top:-15px;width:1px;height:15px;background:#5f3c98}.node .dot{position:absolute;left:11px;top:14px;width:15px;height:15px;border-radius:50%;background:#2a2236;border:1px solid #57446e}.node.available{border-color:#8d58ef;box-shadow:0 0 18px #733bd42b;cursor:pointer}.node.available .dot{background:#8f57f2;box-shadow:0 0 12px #925cff}.node.done{border-color:#4e986e;background:#09120d}.node.done .dot{background:#55c786;box-shadow:0 0 10px #55c786}.node.locked{opacity:.36}.node b{font-size:13px}.node small{display:block;color:#81798c;margin-top:4px}.boss{border-color:#8e3d77;background:linear-gradient(135deg,#1c0c1b,#0a0811)}.boss b{color:#e18ac8}.panel{display:none;position:fixed;inset:0;background:#020206ef;z-index:40;padding:calc(25px + env(safe-area-inset-top)) 18px 30px;overflow:auto}.panel.on{display:block}.card{max-width:520px;margin:30px auto;background:linear-gradient(145deg,#171126,#090811);border:1px solid #8e5ae9;border-radius:22px;padding:22px;box-shadow:0 0 60px #6d38c633}.card .tag{font-size:10px;letter-spacing:.16em;color:#a978ff}.card h2{font-size:23px;margin:10px 0}.card p{color:#aaa1b5;font-size:14px;line-height:1.5}.mission{background:#090711;border:1px solid #302540;border-radius:14px;padding:14px;margin:16px 0}.mission b{display:block;margin-bottom:6px}.reward{color:#b98cff;font-size:13px}.actions{display:grid;gap:9px;margin-top:18px}.actions button{padding:13px;border-radius:12px;border:1px solid #ffffff18;background:#171121;color:white;font-size:14px}.actions .complete{background:#713fd1;border-color:#9b6df0}.actions .complete:disabled{opacity:.4}.toast{position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-100px);background:#151021;border:1px solid #9562eb;border-radius:14px;padding:12px 18px;z-index:70;transition:.35s;box-shadow:0 0 30px #7540d555;font-size:13px}.toast.on{transform:translateX(-50%) translateY(0)}.voiceplus{position:fixed;right:20px;bottom:91px;width:58px;height:58px;border-radius:50%;border:1px solid #b78aff;background:#6e3bd0;color:white;font-size:32px;box-shadow:0 0 25px #7d45ff;z-index:20}.bottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:#05040bf2;border-top:1px solid #ffffff0f;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav{text-align:center;color:#706a78;font-size:10px}.nav b{display:block;font-size:19px}.nav.active{color:#a979ff}</style></head><body><div class="app"><header class="top"><button class="ghost">☰</button><h1>PERSONAL RPG</h1><button class="ghost">⚙</button></header><section class="hero"><div class="core"><small>LEVEL</small><strong id="level">1</strong><small>/ 150</small></div><div class="xp"><div class="bar"><i id="xpbar"></i></div><div class="xptext" id="xptext"></div></div></section><section class="stats"><div class="stat"><b id="str">1</b><span>СИЛА</span></div><div class="stat"><b id="int">1</b><span>ИНТЕЛЛЕКТ</span></div><div class="stat"><b id="eng">1</b><span>ИНЖЕНЕРИЯ</span></div><div class="stat"><b id="fin">1</b><span>ФИНАНСЫ</span></div><div class="stat"><b id="dis">1</b><span>ДИСЦИПЛИНА</span></div><div class="stat"><b id="exp">1</b><span>ИССЛЕДОВАНИЕ</span></div></section><div class="sectiontitle"><h2>Деревья навыков</h2><span id="skillProgress"></span></div><section class="skill"><div class="skillhead"><h3>◈ 3D DESIGN</h3><span class="rank" id="skillLevel"></span></div><p>Изучай → выполняй испытание → получай XP → открывай следующий узел.</p><div class="bar"><i id="skillbar"></i></div><div id="tree" class="tree"></div></section></div><button class="voiceplus" onclick="alert('Голосовые квесты сохранены. В следующем этапе подключим их к общей системе квестов.')">+</button><nav class="bottom"><div class="nav active"><b>✦</b>Персонаж</div><div class="nav"><b>◈</b>Навыки</div><div class="nav"><b>⚔</b>Квесты</div><div class="nav"><b>⌁</b>Мир</div></nav><section id="panel" class="panel"><div class="card"><div class="tag" id="ptag"></div><h2 id="ptitle"></h2><p id="pdesc"></p><div class="mission"><b>ИСПЫТАНИЕ</b><span id="pmission"></span></div><div class="reward" id="preward"></div><div class="actions"><button onclick="markStudied()" id="studyBtn">✓ Я изучил материал</button><button class="complete" onclick="completeNode()" id="completeBtn">Завершить испытание</button><button onclick="closePanel()">Закрыть</button></div></div></section><div id="toast" class="toast"></div><script>const KEY='personal_rpg_v2';const nodes=[['I · НОВИЧОК','Навигация в CAD','E',40,'Освой вращение камеры, панорамирование, масштаб и виды.','Создай новый проект, размести объект и покажи его минимум в трёх видах.'],['I · НОВИЧОК','Примитивы и координаты','E',50,'Куб, цилиндр, сфера и точное позиционирование.','Собери простую композицию из 5 примитивов с заданными размерами.'],['I · НОВИЧОК','Размеры и трансформации','E',60,'Точные размеры, перемещение, вращение и масштаб.','Смоделируй деталь 60×40×20 мм с двумя точно расположенными элементами.'],['I · НОВИЧОК','Boolean-операции','D',80,'Union, Difference и Intersection.','Сделай функциональный кронштейн минимум с тремя Boolean-операциями.'],['I · НОВИЧОК','Отверстия, фаски, скругления','D',90,'Подготовка геометрии к реальной печати.','Создай пластину с отверстиями двух диаметров, фаской и скруглением.'],['I · НОВИЧОК','⚔ BOSS I · Реальная деталь','C',180,'Первый бой: воспроизвести физический объект.','Измерь реальную небольшую деталь, смоделируй, напечатай и добейся правильной посадки.'],['II · КОНСТРУКТОР','Эскизы','D',100,'Линии, окружности, дуги и профили.','Создай три полностью замкнутых эскиза будущих деталей.'],['II · КОНСТРУКТОР','Ограничения эскиза','C',120,'Геометрические и размерные зависимости.','Сделай полностью определённый эскиз без свободных степеней.'],['II · КОНСТРУКТОР','Выдавливание и вращение','C',130,'Extrude и Revolve для инженерной геометрии.','Создай две разные детали: одну выдавливанием, вторую вращением.'],['II · КОНСТРУКТОР','Массивы и зеркалирование','C',140,'Повторяемые элементы и симметрия.','Сделай деталь с линейным/круговым массивом и зеркальным элементом.'],['II · КОНСТРУКТОР','Оболочки и стенки','C',150,'Полые корпуса и контролируемая толщина.','Создай печатаемый корпус со стенкой 2 мм.'],['II · КОНСТРУКТОР','Резьбы и крепёж','C',160,'Винты, гайки, стойки и резьбовые соединения.','Создай соединение двух деталей минимум двумя винтами.'],['II · КОНСТРУКТОР','Допуски и посадки','C',180,'Зазоры с учётом FDM-печати.','Напечатай тест зазоров и найди рабочую посадку для своего принтера.'],['II · КОНСТРУКТОР','⚔ BOSS II · Корпус','B',350,'Корпус из нескольких частей.','Спроектируй, напечатай и собери корпус из двух частей с винтовым креплением.'],['III · ИНЖЕНЕР','Параметры и переменные','B',220,'Управляй моделью через параметры.','Создай деталь, которая перестраивается изменением 3 параметров.'],['III · ИНЖЕНЕР','Конфигурации','B',230,'Семейства размеров одной модели.','Создай минимум три размера одного изделия из одной параметрической модели.'],['III · ИНЖЕНЕР','Сборки','B',250,'Работа с несколькими компонентами.','Собери виртуальную конструкцию минимум из 5 отдельных деталей.'],['III · ИНЖЕНЕР','Сопряжения и движение','B',260,'Оси, шарниры и ограничение движения.','Сделай сборку минимум с одной реально движущейся частью.'],['III · ИНЖЕНЕР','Design for FDM','B',280,'Ориентация, мосты, нависания и минимум поддержек.','Переделай деталь так, чтобы сократить поддержки и сохранить функцию.'],['III · ИНЖЕНЕР','Прочность геометрии','B',300,'Рёбра, направления нагрузки и слабые места.','Усиль нагруженный кронштейн без удвоения массы.'],['III · ИНЖЕНЕР','⚔ BOSS III · Механизм','A',550,'Полноценный функциональный механизм.','Создай и напечатай рабочий механизм минимум из 5 деталей.'],['IV · ADVANCED','Reverse engineering','B',320,'Восстановление геометрии существующего объекта.','Сними размеры с реального предмета и создай цифровую копию.'],['IV · ADVANCED','Сложные поверхности','A',350,'Loft, sweep и переходные формы.','Создай функциональную деталь минимум с двумя сложными поверхностями.'],['IV · ADVANCED','Кабельные каналы','B',280,'Маршрутизация проводки внутри изделия.','Создай корпус с каналами и фиксацией проводов.'],['IV · ADVANCED','Крепление электроники','A',350,'PCB, стойки, разъёмы и доступ к обслуживанию.','Спроектируй корпус под реальную плату с отверстиями и разъёмами.'],['IV · ADVANCED','Подшипники и валы','A',380,'Посадки вращающихся элементов.','Создай узел вал + два подшипника + корпус.'],['IV · ADVANCED','Защёлки и петли','A',400,'Подвижные и безвинтовые соединения.','Создай и напечатай рабочую петлю или защёлку.'],['IV · ADVANCED','Проектирование обслуживания','A',420,'Разборка, ремонт и замена компонентов.','Переделай корпус так, чтобы ключевой компонент снимался без разрушения.'],['IV · ADVANCED','Итерации прототипа','A',450,'V1 → ошибки → V2.','Создай V1 реальной детали, найди минимум 3 недостатка и исправь их в V2.'],['IV · ADVANCED','⚔ BOSS IV · Модуль устройства','A',750,'Реальный инженерный модуль.','Разработай для существующего устройства новый функциональный корпус или модуль.'],['V · CREATOR','Техническое задание','B',300,'Формулируй требования до CAD.','Напиши ТЗ на собственное устройство: функция, размеры, ограничения, критерии успеха.'],['V · CREATOR','Концепт и архитектура','A',400,'Разделение устройства на подсистемы.','Создай схему компонентов и минимум два варианта компоновки.'],['V · CREATOR','CAD полного изделия','A',550,'Полная цифровая сборка.','Создай CAD-сборку будущего устройства со всеми основными компонентами.'],['V · CREATOR','Прототип V1','A',650,'Первое физическое воплощение.','Напечатай и собери первую рабочую версию.'],['V · CREATOR','Испытания','A',500,'Проверка требований и фиксация проблем.','Проведи тесты и составь список минимум из 5 наблюдений/улучшений.'],['V · CREATOR','Версия V2','S',900,'Инженерная переработка по результатам тестов.','Исправь проблемы V1 и собери улучшенную V2.'],['V · CREATOR','♛ FINAL BOSS · Собственное устройство','S',2000,'Финальное испытание 3D Design.','От идеи и ТЗ пройди CAD, прототип, испытания и V2 до реально работающего собственного устройства.']];let state=JSON.parse(localStorage.getItem(KEY)||'{"xp":0,"done":[],"studied":[]}'),selected=0;function need(l){return 500+(l-1)*250}function calcLevel(x){let l=1,r=x;while(l<150&&r>=need(l)){r-=need(l);l++}return[l,r,need(l)]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function render(){let [l,r,n]=calcLevel(state.xp);level.textContent=l;xpbar.style.width=(r/n*100)+'%';xptext.textContent=r+' / '+n+' XP';let done=state.done.length;skillProgress.textContent=done+' / '+nodes.length+' узлов';skillLevel.textContent='LVL '+Math.min(20,Math.floor(done/nodes.length*20))+' / 20';skillbar.style.width=(done/nodes.length*100)+'%';eng.textContent=1+Math.floor(done/3);int.textContent=1+Math.floor(done/7);dis.textContent=1+Math.floor(done/10);let html='',ch='';nodes.forEach((x,i)=>{if(x[0]!=ch){ch=x[0];html+='<div class="chapter">'+ch+'</div>'}let done=state.done.includes(i),avail=i===0||state.done.includes(i-1),cls=done?'done':avail?'available':'locked',boss=x[1].includes('BOSS');html+=`<div class="node ${cls} ${boss?'boss':''}" ${avail&&!done?`onclick="openNode(${i})"`:''}><i class="dot"></i><b>${done?'✓ ':''}${String(i+1).padStart(2,'0')} · ${x[1]}</b><small>${x[2]}-RANK · +${x[3]} XP · ${done?'выполнено':avail?'доступно':'заблокировано'}</small></div>`});tree.innerHTML=html}function openNode(i){selected=i;let x=nodes[i];ptag.textContent=x[2]+'-RANK · +'+x[3]+' XP';ptitle.textContent=x[1];pdesc.textContent=x[4];pmission.textContent=x[5];preward.textContent='Награда: +'+x[3]+' общего XP · Engineering XP · Intelligence XP';studyBtn.textContent=state.studied.includes(i)?'✓ Материал изучен':'✓ Я изучил материал';completeBtn.disabled=!state.studied.includes(i);panel.classList.add('on')}function markStudied(){if(!state.studied.includes(selected))state.studied.push(selected);save();studyBtn.textContent='✓ Материал изучен';completeBtn.disabled=false;toastMsg('Этап обучения отмечен')}function completeNode(){if(!state.studied.includes(selected)||state.done.includes(selected))return;state.done.push(selected);state.xp+=nodes[selected][3];save();panel.classList.remove('on');render();toastMsg('QUEST COMPLETE · +'+nodes[selected][3]+' XP')}function closePanel(){panel.classList.remove('on')}function toastMsg(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200)}render()</script></body></html>
