<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030308"><title>FastGo OS — Мои цели</title><style>:root{--violet:#925cff;--bright:#b68cff;--ink:#030308;--card:rgba(15,12,27,.86);--line:rgba(146,92,255,.32);--muted:#918ca3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030308;color:#f6f3ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 15% 12%,rgba(150,100,255,.7) 0 1px,transparent 1.5px),radial-gradient(circle at 77% 20%,rgba(255,255,255,.35) 0 1px,transparent 1.5px),radial-gradient(circle at 36% 62%,rgba(126,80,230,.45) 0 1px,transparent 1.5px),radial-gradient(circle at 82% 76%,rgba(255,255,255,.28) 0 1px,transparent 1.5px);background-size:137px 151px,193px 181px,223px 197px,271px 241px}.shell{min-height:100vh;position:relative;padding:calc(22px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom))}.top{height:58px;display:flex;align-items:center;justify-content:center;position:relative;z-index:5}.top h1{font-size:22px;margin:0;font-weight:650}.iconbtn{position:absolute;width:44px;height:44px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(12,10,22,.75);color:#c7bfd8;font-size:22px}.menu{left:0}.settings{right:0}.universe{position:relative;max-width:920px;height:680px;margin:12px auto 0}.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(143,91,255,.13);border-radius:50%;pointer-events:none}.o1{width:230px;height:230px}.o2{width:430px;height:430px}.o3{width:640px;height:640px}.o1:after,.o2:after,.o3:after{content:"";position:absolute;width:5px;height:5px;background:#955eff;border-radius:50%;box-shadow:0 0 12px #955eff}.o1:after{right:8%;top:26%}.o2:after{left:6%;top:56%}.o3:after{right:12%;bottom:19%}.add{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:1px solid #a879ff;background:radial-gradient(circle at 42% 35%,#a878ff,#6634ce 55%,#321a6d);box-shadow:0 0 22px #7d46ff,0 0 70px rgba(119,63,255,.35);color:white;font-size:58px;font-weight:200;line-height:1;z-index:4}.goal{position:absolute;width:245px;min-height:116px;padding:16px;background:linear-gradient(135deg,rgba(23,17,42,.94),rgba(9,8,18,.9));border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #0008,0 0 24px rgba(118,66,235,.08);backdrop-filter:blur(10px);z-index:3}.goal h3{font-size:15px;margin:0 0 14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progressrow{display:flex;align-items:center;gap:10px}.bar{height:7px;background:#191525;border-radius:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#7e45ff,#a96dff);box-shadow:0 0 12px #8148ff}.pct{font-size:13px;color:#d8d0e8}.sub{font-size:12px;color:var(--muted);margin-top:12px}.g0{left:50%;top:4%;transform:translateX(-50%)}.g1{left:2%;top:27%}.g2{right:2%;top:28%}.g3{left:5%;bottom:10%}.g4{right:5%;bottom:10%}.goal:nth-of-type(n+9){display:none}.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:rgba(5,4,11,.9);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px);z-index:10}.nav{color:#777181;font-size:11px;text-align:center}.nav b{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:#a16cff}dialog{width:min(500px,92vw);border:1px solid rgba(146,92,255,.4);border-radius:20px;background:#0e0b18;color:white;padding:20px;box-shadow:0 0 70px #6d39dd55}dialog::backdrop{background:#000c;backdrop-filter:blur(4px)}.form{display:grid;gap:11px}.form h2{margin:0 0 5px}.form label{display:grid;gap:5px;color:#a8a1b8;font-size:13px}.form input,.form select{width:100%;padding:12px;border:1px solid #34284f;border-radius:11px;background:#090711;color:white;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:11px;font-weight:700}.save{background:#925cff;color:white}.cancel{background:#211a30;color:#c9c1d8}.hint{text-align:center;color:#736d82;font-size:12px;position:absolute;left:0;right:0;bottom:0}@media(max-width:650px){.universe{height:660px}.orbit.o3{width:570px;height:570px}.orbit.o2{width:370px;height:370px}.goal{width:185px;min-height:105px;padding:13px}.g0{top:4%}.g1{left:-4%;top:27%}.g2{right:-4%;top:27%}.g3{left:-2%;bottom:9%}.g4{right:-2%;bottom:9%}.goal h3{font-size:13px}.add{width:94px;height:94px;font-size:48px}.two{grid-template-columns:1fr}}@media(max-width:390px){.goal{width:165px}.universe{height:620px}.orbit.o3{width:520px;height:520px}.g1{left:-7%}.g2{right:-7%}}</style></head><body><div class="shell"><header class="top"><button class="iconbtn menu">☰</button><h1>Мои цели</h1><button class="iconbtn settings">⌕</button></header><main class="universe" id="universe"><div class="orbit o3"></div><div class="orbit o2"></div><div class="orbit o1"></div><button class="add" onclick="openForm()" aria-label="Добавить цель">+</button><div class="hint">Нажми +, чтобы добавить новую цель</div></main></div><nav class="bottom"><div class="nav active"><b>★</b>Цели</div><div class="nav"><b>♜</b>Достижения</div><div class="nav"><b>▥</b>Статистика</div><div class="nav"><b>⚙</b>Настройки</div></nav><dialog id="dlg"><form id="form" class="form"><h2>Новая цель</h2><label>Название<input id="title" required placeholder="Например: Создать мастерскую"></label><div class="two"><label>Сейчас<input id="current" type="number" value="0" min="0"></label><label>Цель<input id="target" type="number" value="100" min="1"></label></div><label>Дедлайн<input id="deadline" type="date"></label><div class="actions"><button class="save" type="submit">Добавить</button><button class="cancel" type="button" onclick="dlg.close()">Отмена</button></div></form></dialog><script>const KEY='fastgo_orbit_goals_v1',dlg=document.getElementById('dlg'),form=document.getElementById('form'),U=document.getElementById('universe');let goals=JSON.parse(localStorage.getItem(KEY)||'[]');function esc(v){return String(v).replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))}function render(){U.querySelectorAll('.goal').forEach(x=>x.remove());goals.slice(0,5).forEach((g,i)=>{let p=Math.max(0,Math.min(100,g.target?g.current/g.target*100:0)),el=document.createElement('article');el.className='goal g'+i;el.innerHTML=`<h3>${esc(g.title)}</h3><div class="progressrow"><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${Math.round(p)}%</span></div><div class="sub">${g.current} / ${g.target}${g.deadline?' · до '+new Date(g.deadline+'T00:00').toLocaleDateString('ru-RU'):''}</div>`;el.onclick=()=>{if(confirm('Удалить цель «'+g.title+'»?')){goals=goals.filter(x=>x.id!==g.id);save()}};U.appendChild(el)})}function save(){localStorage.setItem(KEY,JSON.stringify(goals));render()}function openForm(){form.reset();document.getElementById('current').value=0;document.getElementById('target').value=100;dlg.showModal()}form.onsubmit=e=>{e.preventDefault();goals.push({id:crypto.randomUUID(),title:document.getElementById('title').value.trim(),current:Number(document.getElementById('current').value),target:Number(document.getElementById('target').value),deadline:document.getElementById('deadline').value});save();dlg.close()};render()</script></body></html>
