<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030308"><title>FastGo OS — Мои цели</title><style>:root{--v:#925cff;--m:#918ca3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030308;color:#f6f3ff;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden;background-image:radial-gradient(circle at 15% 12%,#9564ff 0 1px,transparent 1.5px),radial-gradient(circle at 77% 20%,#ffffff55 0 1px,transparent 1.5px),radial-gradient(circle at 36% 62%,#7e50e673 0 1px,transparent 1.5px),radial-gradient(circle at 82% 76%,#ffffff44 0 1px,transparent 1.5px);background-size:137px 151px,193px 181px,223px 197px,271px 241px}.shell{min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 18px 95px}.top{height:58px;display:flex;align-items:center;justify-content:center;position:relative;z-index:5}.top h1{font-size:22px;margin:0}.iconbtn{position:absolute;width:44px;height:44px;border:1px solid #ffffff14;border-radius:13px;background:#0c0a16bf;color:#c7bfd8;font-size:22px}.menu{left:0}.settings{right:0}.universe{position:relative;max-width:920px;height:680px;margin:12px auto 0}.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #8f5bff21;border-radius:50%;pointer-events:none}.o1{width:230px;height:230px}.o2{width:430px;height:430px}.o3{width:640px;height:640px}.add{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:1px solid #a879ff;background:radial-gradient(circle at 42% 35%,#a878ff,#6634ce 55%,#321a6d);box-shadow:0 0 22px #7d46ff,0 0 70px #773fff59;color:white;font-size:58px;font-weight:200;z-index:4}.goal{position:absolute;width:245px;min-height:116px;padding:16px;background:linear-gradient(135deg,#17112af0,#090812e6);border:1px solid #925cff52;border-radius:18px;box-shadow:0 10px 35px #0008;z-index:3}.goal h3{font-size:15px;margin:0 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progressrow{display:flex;align-items:center;gap:10px}.bar{height:7px;background:#191525;border-radius:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7e45ff,#a96dff);box-shadow:0 0 12px #8148ff}.pct{font-size:13px}.sub{font-size:12px;color:var(--m);margin-top:12px}.g0{left:50%;top:4%;transform:translateX(-50%)}.g1{left:2%;top:27%}.g2{right:2%;top:28%}.g3{left:5%;bottom:10%}.g4{right:5%;bottom:10%}.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;display:flex;justify-content:space-around;align-items:center;background:#05040be6;border-top:1px solid #ffffff0f;z-index:10}.nav{color:#777181;font-size:11px;text-align:center}.nav b{display:block;font-size:21px}.nav.active{color:#a16cff}.voice{display:none;position:fixed;inset:0;background:#020206e8;backdrop-filter:blur(10px);z-index:30;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center}.voice.on{display:flex}.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c09aff,#814bff 35%,#35136e 68%,#130925);box-shadow:0 0 35px #884dff,0 0 110px #6731d966;animation:pulse 1.7s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:42px}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 55px #9b68ff,0 0 130px #6731d988}}.question{font-size:24px;max-width:430px;margin:34px 0 10px}.heard{color:#a9a0b8;min-height:48px;max-width:450px}.vstatus{font-size:12px;color:#8f62e8;text-transform:uppercase;letter-spacing:2px;margin-top:12px}.closev{margin-top:30px;border:1px solid #ffffff20;background:#151020;color:#bbb1c9;border-radius:12px;padding:11px 20px}dialog{width:min(500px,92vw);border:1px solid #925cff66;border-radius:20px;background:#0e0b18;color:white;padding:20px}dialog::backdrop{background:#000c}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;color:#a8a1b8;font-size:13px}.form input{padding:12px;border:1px solid #34284f;border-radius:11px;background:#090711;color:white}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:11px}.save{background:#925cff;color:white}.cancel{background:#211a30;color:#c9c1d8}.manual{margin-top:12px;color:#8f869e;font-size:12px;text-decoration:underline}.hint{text-align:center;color:#736d82;font-size:12px;position:absolute;left:0;right:0;bottom:0}@media(max-width:650px){.universe{height:660px}.o3{width:570px;height:570px}.o2{width:370px;height:370px}.goal{width:185px;min-height:105px;padding:13px}.g1{left:-4%;top:27%}.g2{right:-4%;top:27%}.g3{left:-2%;bottom:9%}.g4{right:-2%;bottom:9%}.add{width:94px;height:94px;font-size:48px}}</style></head><body><div class="shell"><header class="top"><button class="iconbtn menu">☰</button><h1>Мои цели</h1><button class="iconbtn settings">⌕</button></header><main class="universe" id="universe"><div class="orbit o3"></div><div class="orbit o2"></div><div class="orbit o1"></div><button class="add" onclick="startVoice()">+</button><div class="hint">Нажми + и расскажи о новой цели</div></main></div><nav class="bottom"><div class="nav active"><b>★</b>Цели</div><div class="nav"><b>♜</b>Достижения</div><div class="nav"><b>▥</b>Статистика</div><div class="nav"><b>⚙</b>Настройки</div></nav><section id="voice" class="voice"><div class="orb">◉</div><div id="question" class="question"></div><div id="heard" class="heard"></div><div id="vstatus" class="vstatus">Говорю</div><button class="closev" onclick="stopVoice()">Отмена</button><button class="manual" onclick="stopVoice();dlg.showModal()">Ввести вручную</button></section><dialog id="dlg"><form id="form" class="form"><h2>Новая цель</h2><label>Название<input id="title" required></label><label>Сейчас<input id="current" type="number" value="0"></label><label>Цель<input id="target" type="number" value="100"></label><label>Дедлайн<input id="deadline" type="date"></label><div class="actions"><button class="save">Добавить</button><button class="cancel" type="button" onclick="dlg.close()">Отмена</button></div></form></dialog><script>const KEY='fastgo_orbit_goals_v1',U=document.getElementById('universe'),dlg=document.getElementById('dlg'),form=document.getElementById('form'),V=document.getElementById('voice'),Q=document.getElementById('question'),H=document.getElementById('heard'),S=document.getElementById('vstatus');let goals=JSON.parse(localStorage.getItem(KEY)||'[]'),rec=null,step=0,draft={};const prompts=['Какую цель ты хочешь поставить?','Какое значение будет означать, что цель достигнута? Назови число.','Сколько уже выполнено сейчас? Назови число.','Когда ты хочешь достичь этой цели? Назови дату.','Я всё записал. Сказать «да», чтобы сохранить цель, или «нет», чтобы отменить.'];function esc(v){return String(v).replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]))}function render(){U.querySelectorAll('.goal').forEach(x=>x.remove());goals.slice(0,5).forEach((g,i)=>{let p=Math.max(0,Math.min(100,g.target?g.current/g.target*100:0)),el=document.createElement('article');el.className='goal g'+i;el.innerHTML=`<h3>${esc(g.title)}</h3><div class="progressrow"><div class="bar"><i style="width:${p}%"></i></div><span class="pct">${Math.round(p)}%</span></div><div class="sub">${g.current} / ${g.target}${g.deadline?' · до '+new Date(g.deadline+'T00:00').toLocaleDateString('ru-RU'):''}</div>`;U.appendChild(el)})}function speak(t,listen=true){Q.textContent=t;S.textContent='Говорю';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.95;u.onend=()=>{if(listen)setTimeout(listenNow,250)};speechSynthesis.speak(u)}function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){dlg.showModal();alert('На этом браузере голосовое распознавание недоступно. Можно заполнить цель вручную.');return}step=0;draft={};V.classList.add('on');H.textContent='';speak(prompts[0])}function listenNow(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.continuous=false;S.textContent='Слушаю…';rec.onresult=e=>{let text=[...e.results].map(r=>r[0].transcript).join(' ');H.textContent='«'+text+'»';if(e.results[e.results.length-1].isFinal)accept(text)};rec.onerror=e=>{S.textContent='Не расслышал';setTimeout(()=>speak('Не расслышал. Повтори, пожалуйста.'),700)};rec.start()}function numberFrom(t){let n=Number((t.match(/[\d\s]+/)||[''])[0].replace(/\s/g,''));return Number.isFinite(n)&&n>0?n:null}function dateFrom(t){let d=new Date(t);if(!isNaN(d))return d.toISOString().slice(0,10);let m=t.match(/(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):new Date().getFullYear();if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}return ''}function accept(t){if(rec)try{rec.stop()}catch(e){};if(step===0)draft.title=t.trim();if(step===1){draft.target=numberFrom(t)||100}if(step===2){draft.current=numberFrom(t)||0}if(step===3){draft.deadline=dateFrom(t)}if(step===4){if(/да|сохран|верно|правильно/i.test(t)){goals.push({id:crypto.randomUUID(),...draft});localStorage.setItem(KEY,JSON.stringify(goals));render();speak('Готово. Цель добавлена.',false);setTimeout(stopVoice,1700)}else{stopVoice()}return}step++;H.textContent='';if(step===4){let summary=`Цель: ${draft.title}. Прогресс ${draft.current||0} из ${draft.target||100}`+(draft.deadline?`. Срок ${new Date(draft.deadline+'T00:00').toLocaleDateString('ru-RU')}.`:'.');speak(summary+' '+prompts[4])}else speak(prompts[step])}function stopVoice(){speechSynthesis.cancel();if(rec)try{rec.abort()}catch(e){};V.classList.remove('on');S.textContent='Говорю';H.textContent=''}form.onsubmit=e=>{e.preventDefault();goals.push({id:crypto.randomUUID(),title:document.getElementById('title').value.trim(),current:Number(document.getElementById('current').value),target:Number(document.getElementById('target').value),deadline:document.getElementById('deadline').value});localStorage.setItem(KEY,JSON.stringify(goals));render();dlg.close();form.reset()};render()</script></body></html>
