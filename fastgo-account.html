<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastGo — личный кабинет</title><style>:root{--bg:#0b0f14;--panel:#141b23;--panel2:#0e141b;--line:#293542;--text:#eef2f7;--muted:#96a3b4;--accent:#b8ff35;--purple:#c43cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}header{display:flex;justify-content:center;padding:28px 20px 18px}header img{width:min(320px,76vw)}main{max-width:720px;margin:auto;padding:18px 20px 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px}h1{font-size:clamp(32px,7vw,44px);margin:0 0 10px}.muted{color:var(--muted)}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(184,255,53,.12);color:var(--accent);font-weight:850}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #222d38}.row:last-child{border:0}.row b{text-align:right}.request{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.request.active{border-color:rgba(196,60,255,.65)}input{width:100%;min-height:52px;background:#0b1118;color:#fff;border:1px solid #3a4859;border-radius:11px;padding:11px 13px;font:inherit}button,a.btn{display:block;width:100%;min-height:56px;border:0;border-radius:12px;margin-top:14px;background:var(--accent);color:#10150b;font:inherit;font-size:18px;font-weight:900;text-align:center;text-decoration:none;padding:16px}.hidden{display:none}</style></head><body><header><img src="fastgo-logo.png" alt="FastGo"></header><main><section class="card"><h1>Личный кабинет</h1><p class="muted">Здесь отображаются текущая заявка, статус проверки, оплаты и история аренд.</p><div id="lookup"><input id="phone" type="tel" placeholder="Телефон, указанный в заявке"><button id="find">Показать мои заявки</button></div></section><section id="current" class="card hidden"><h2>Текущая аренда</h2><div id="currentBody"></div></section><section id="historyCard" class="card hidden"><h2>История заявок</h2><div id="history"></div></section><a class="btn" href="rent.html">Новая аренда</a></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-public-api',$=x=>document.getElementById(x);function fmt(v){return v?new Date(v).toLocaleDateString('ru-RU'):'—'}function label(s){return({pending_payment:'Ожидает оплаты',pending_payment_confirmation:'Проверяем оплату',confirmed:'Подтверждена',active:'Аренда активна',completed:'Завершена',cancelled:'Отменена',pending_review:'Проверяем документы',verified:'Личность подтверждена',awaiting_receipt:'Ожидает чек',pending_confirmation:'Проверяем перевод',paid:'Оплачено'})[s]||s||'—'}async function api(action,params){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,params})}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j.data}function item(r,active=false){return `<div class="request ${active?'active':''}"><div class="row"><span class="muted">Заявка</span><b>${String(r.id).slice(0,8).toUpperCase()}</b></div><div class="row"><span class="muted">Велосипед</span><b>${r.bike_code||'—'}</b></div><div class="row"><span class="muted">Тариф</span><b>${r.tariff_code||'—'}</b></div><div class="row"><span class="muted">Период</span><b>${fmt(r.starts_at)} — ${fmt(r.ends_at)}</b></div><div class="row"><span class="muted">Сумма</span><b>${r.amount||0} ₽</b></div><div class="row"><span class="muted">Заявка</span><b class="status">${label(r.status)}</b></div><div class="row"><span class="muted">Документы</span><b>${label(r.identity_status)}</b></div><div class="row"><span class="muted">Оплата</span><b>${label(r.payment_status)}</b></div></div>`}async function showById(id){try{let r=await api('customer_request',{request_id:id});$('currentBody').innerHTML=item(r,true);$('current').classList.remove('hidden');$('phone').value=r.customer_phone||''}catch(e){}}async function find(){let phone=$('phone').value.trim();if(!phone)return;localStorage.setItem('fastgo_customer_phone',phone);try{let list=await api('customer_history',{phone});if(list.length){$('currentBody').innerHTML=item(list[0],true);$('current').classList.remove('hidden');$('history').innerHTML=list.slice(1).map(r=>item(r)).join('')||'<p class="muted">Предыдущих заявок пока нет.</p>';$('historyCard').classList.remove('hidden')}else{$('history').innerHTML='<p class="muted">Заявки по этому номеру не найдены.</p>';$('historyCard').classList.remove('hidden')}}catch(e){$('history').textContent=e.message;$('historyCard').classList.remove('hidden')}}$('find').onclick=find;let saved=localStorage.getItem('fastgo_customer_phone');if(saved){$('phone').value=saved;find()}let id=sessionStorage.getItem('fastgo_request_id');if(id)showById(id);</script></body></html>
