<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Все ремонты — FastGo Service</title><style>:root{--b:#0b0f14;--p:#141b23;--l:#293542;--t:#eef2f7;--m:#96a3b4;--g:#b8ff35}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui}main{max-width:1400px;margin:auto;padding:26px 20px}h1{font-size:36px;margin:0}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:10px;background:var(--g);color:#10150b;text-decoration:none;font-weight:900}.btn.alt{background:#25303d;color:white}.filters{display:grid;grid-template-columns:1fr 230px;gap:10px;margin:20px 0}input,select{width:100%;padding:14px;border:1px solid #3a4859;border-radius:11px;background:#0e141b;color:white;font:inherit}.item{display:grid;grid-template-columns:95px 1.25fr 1fr 170px 170px 270px;gap:14px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px;margin:9px 0}.n{font-size:21px;font-weight:900;color:var(--g)}.muted{color:var(--m);font-size:13px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#25303d;font-size:13px;font-weight:800}.acts{display:flex;gap:7px;flex-wrap:wrap}.acts a{padding:9px 11px;border-radius:9px;text-decoration:none;background:#25303d;color:white;font-weight:800}.acts a:first-child{background:var(--g);color:#10150b}@media(max-width:1000px){.item{grid-template-columns:1fr 1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:650px){.item{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>Все ремонты</h1><div class="muted" id="count">Загрузка…</div></div><div class="buttons"><a class="btn" href="service.html">+ Новая приёмка</a><a class="btn alt" href="storage.html">Зимнее хранение</a></div></div><div class="filters"><input id="q" placeholder="Поиск: №, ФИО, телефон, бренд, модель"><select id="st"><option value="">Все статусы</option><option value="accepted">Принят</option><option value="diagnostics">Диагностика</option><option value="waiting_parts">Ждём запчасти</option><option value="repair">В ремонте</option><option value="ready">Готов</option><option value="issued">Выдан</option><option value="cancelled">Отменён</option></select></div><div id="list">Загрузка…</div></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-service-api';let all=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),labels={accepted:'Принят',diagnostics:'Диагностика',waiting_parts:'Ждём запчасти',repair:'В ремонте',ready:'Готов',issued:'Выдан',cancelled:'Отменён'};async function load(){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'list',params:{}})}),j=await r.json();all=j.data||[];draw()}function draw(){let q=$('q').value.toLowerCase().trim(),st=$('st').value,a=all.filter(x=>(!st||x.status===st)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('count').textContent='Показано: '+a.length+' из '+all.length;$('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="n">№ ${String(x.repair_number).padStart(4,'0')}</div><div><b>${esc([x.last_name,x.first_name,x.middle_name].filter(Boolean).join(' '))}</b><div class="muted">${esc(x.phone)}</div></div><div><b>${esc(x.vehicle_type)} · ${esc(x.brand)} ${esc(x.model)}</b><div class="muted">${esc(x.issue_description||'неисправность не указана')}</div></div><div><span class="status">${labels[x.status]||x.status}</span><div class="muted">${esc(x.assigned_master||'мастер не назначен')}</div></div><div><b>${Number(x.total_amount||0).toLocaleString('ru-RU')} ₽</b><div class="muted">${x.promised_date?'до '+new Date(x.promised_date).toLocaleDateString('ru-RU'):'срок не указан'}</div></div><div class="acts"><a href="service-card.html?id=${encodeURIComponent(x.id)}">Техкарта</a><a href="service-contract.html?id=${encodeURIComponent(x.id)}" target="_blank">Печать / QR</a></div></div>`).join(''):'Ремонты не найдены'}$('q').oninput=draw;$('st').onchange=draw;load();setInterval(load,60000)</script></body></html>
