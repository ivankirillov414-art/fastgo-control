<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastGo — оформление аренды</title>
<style>
:root{--bg:#0b0f14;--panel:#141b23;--panel2:#0e141b;--line:#293542;--text:#eef2f7;--muted:#96a3b4;--accent:#b8ff35}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 50% 16%,rgba(184,255,53,.035),transparent 28%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{display:flex;justify-content:center;padding:28px 20px 18px}.logo{width:min(320px,76vw)}.logo img{display:block;width:100%}main{width:100%;max-width:720px;margin:auto;padding:18px 20px 56px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}h1{font-size:clamp(30px,5vw,42px);margin:0 0 10px}.muted{color:var(--muted)}.summary{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0}.summary strong{font-size:22px;color:var(--accent)}label{display:block;color:var(--muted);font-weight:700;margin:14px 0 7px}input,button{width:100%;min-height:56px;border-radius:12px;font:inherit}input{border:1px solid #3a4859;background:var(--panel2);color:#fff;padding:13px 14px}button{margin-top:18px;border:0;background:var(--accent);color:#10150b;font-weight:850;font-size:18px;cursor:pointer}.note{font-size:13px;margin-top:14px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="logo"><img src="fastgo-logo.png" alt="FastGo"></div></header>
<main><section class="card">
<h1>Оформление аренды</h1>
<p class="muted">Проверьте выбранный тариф и укажите период аренды.</p>
<div class="summary"><span class="muted">Выбранный тариф</span><br><strong id="tariffName">Загрузка…</strong><div id="tariffInfo" class="muted"></div></div>
<label for="startsAt">Начало аренды</label><input id="startsAt" type="datetime-local">
<label for="endsAt">Окончание аренды</label><input id="endsAt" type="datetime-local">
<button id="continueBtn" type="button">Продолжить</button>
<p id="msg" class="note">Авторизация временно отключена. Мы вернём её позже.</p>
</section></main>
<script>
const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-public-api';
const $=id=>document.getElementById(id);
const selected=(new URLSearchParams(location.search).get('tariff')||'').toUpperCase();
let tariff=null;
async function load(){
 const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());const later=new Date(now.getTime()+86400000);$('startsAt').value=now.toISOString().slice(0,16);$('endsAt').value=later.toISOString().slice(0,16);
 try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'landing',params:{}}),cache:'no-store'});const j=await r.json();const list=j.data?.tariffs||[];tariff=list.find(t=>String(t.code||t.id||'').toUpperCase()===selected)||null;if(!tariff)throw Error('Тариф не найден');$('tariffName').textContent=(tariff.name||'Тариф')+' — '+tariff.price+' ₽';$('tariffInfo').textContent=tariff.description||'';}catch(e){$('tariffName').textContent='Не удалось загрузить тариф';$('msg').textContent=e.message;}}
$('continueBtn').onclick=()=>{if(!tariff){$('msg').textContent='Сначала выберите тариф.';return;}if(!$('startsAt').value||!$('endsAt').value){$('msg').textContent='Укажите период аренды.';return;}$('msg').textContent='Тариф и период выбраны. Следующим шагом подключим выбор велосипеда и оформление брони.';};
load();
</script>
</body></html>
