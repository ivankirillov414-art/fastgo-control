<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastGo — оформление аренды</title><style>:root{--bg:#0b0f14;--panel:#141b23;--panel2:#0e141b;--line:#293542;--text:#eef2f7;--muted:#96a3b4;--accent:#b8ff35;--selected:#c43cff}*{box-sizing:border-box}html,body{min-height:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}header{display:flex;justify-content:center;padding:28px 20px 18px}.logo{width:min(320px,76vw)}.logo img{display:block;width:100%}main{width:100%;max-width:720px;margin:auto;padding:18px 20px 56px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;overflow:hidden}h1{font-size:clamp(30px,5vw,42px);margin:0 0 10px}.muted{color:var(--muted)}.summary{background:linear-gradient(180deg,rgba(196,60,255,.08),rgba(196,60,255,.015)),var(--panel2);border:1px solid rgba(196,60,255,.6);border-radius:14px;padding:16px;margin:18px 0}.summary strong{font-size:22px;color:var(--selected)}label{display:block;color:var(--muted);font-weight:700;margin:14px 0 7px}.date-wrap{width:100%;overflow:hidden;border:1px solid #3a4859;background:var(--panel2);border-radius:12px}input[type=datetime-local]{display:block;width:100%;min-width:0;height:58px;border:0;background:transparent;color:#fff;padding:13px 14px;font:inherit;-webkit-appearance:none;appearance:none}button{display:block;width:100%;min-height:56px;border:0;border-radius:12px;margin-top:18px;background:var(--accent);color:#10150b;font:inherit;font-weight:850;font-size:18px;cursor:pointer}.note{font-size:13px;margin-top:14px;color:var(--muted)}.hidden{display:none}.bikes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.bike{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;touch-action:manipulation}.bike.selected{border:2px solid var(--selected);box-shadow:0 0 0 2px rgba(196,60,255,.2),0 0 24px rgba(196,60,255,.38)}.bike img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.bike-body{padding:12px}.bike-code{font-size:18px;font-weight:850}.bike-status{font-size:12px;color:var(--accent);margin-top:4px}.details{border:1px solid rgba(196,60,255,.55);background:rgba(196,60,255,.06);border-radius:14px;padding:15px;margin-top:16px}.details-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.details-row span:last-child{text-align:right;font-weight:750}.section-title{font-size:25px;margin:6px 0}.back{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:10px}@media(max-width:480px){.card{padding:20px 18px}h1{font-size:34px}.bikes{gap:10px}.bike-body{padding:10px}}</style></head><body><header><div class="logo"><img src="fastgo-logo.png" alt="FastGo"></div></header><main><section class="card"><div id="periodStep"><h1>Оформление аренды</h1><p class="muted">Проверьте выбранный тариф и укажите период аренды.</p><div class="summary"><span class="muted">Выбранный тариф</span><br><strong id="tariffName">Загрузка…</strong><div id="tariffInfo" class="muted"></div></div><label>Начало аренды</label><div class="date-wrap"><input id="startsAt" type="datetime-local"></div><label>Окончание аренды</label><div class="date-wrap"><input id="endsAt" type="datetime-local"></div><button id="continueBtn">Продолжить</button><p id="msg" class="note"></p></div><div id="bikeStep" class="hidden"><h1>Выберите велосипед</h1><p class="muted">Показываем только свободную и готовую к выдаче технику.</p><div id="bikes" class="bikes"></div><div id="bikeDetails" class="details hidden"><div class="section-title" id="bikeTitle"></div><div class="details-row"><span class="muted">Тариф</span><span id="detailTariff"></span></div><div class="details-row"><span class="muted">Срок аренды</span><span id="detailDays"></span></div><div class="details-row"><span class="muted">Период</span><span id="detailPeriod"></span></div><div class="details-row"><span class="muted">Стоимость</span><span id="detailPrice"></span></div></div><button id="confirmBtn">Подтвердить аренду</button><button id="backBtn" class="back">Назад</button><p id="bikeMsg" class="note"></p></div></section></main><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-public-api',BIKE_IMG='fastgo-point.jpg',$=id=>document.getElementById(id),qs=new URLSearchParams(location.search),selected=(qs.get('tariff')||sessionStorage.getItem('fastgo_selected_tariff')||'').toUpperCase();let tariff=null,minDays=1,selectedBike=null,bikes=[];function localValue(d){let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)}function detectMinDays(t){let text=((t?.name||'')+' '+(t?.description||'')+' '+(t?.code||'')).toLowerCase(),m=text.match(/(?:от\s*)?(\d+)\s*(?:дн|дня|дней|day)/);if(m)return Math.max(1,+m[1]);if(/недел|week/.test(text))return 7;if(/месяц|month/.test(text))return 30;return 1}function syncEnd(force=false){let s=new Date($('startsAt').value);if(isNaN(s))return;let min=new Date(s.getTime()+minDays*86400000);$('endsAt').min=localValue(min);let e=new Date($('endsAt').value);if(force||isNaN(e)||e<min)$('endsAt').value=localValue(min)}async function api(action,params={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,params}),cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка загрузки');return j.data}async function load(){let now=new Date();$('startsAt').value=localValue(now);try{let d=await api('landing'),list=d.tariffs||[];tariff=list.find(t=>String(t.code||t.id||'').toUpperCase()===selected);if(!tariff)throw Error('Тариф не найден');minDays=detectMinDays(tariff);$('tariffName').textContent=(tariff.name||'Тариф')+' — '+tariff.price+' ₽';$('tariffInfo').textContent=tariff.description||'';syncEnd(true)}catch(e){$('msg').textContent=e.message}}function days(){return Math.ceil((new Date($('endsAt').value)-new Date($('startsAt').value))/86400000)}async function loadBikes(){try{bikes=await api('available_bikes');renderBikes()}catch(e){$('bikeMsg').textContent=e.message}}function renderBikes(){if(!bikes.length){$('bikes').innerHTML='<p class="muted">Сейчас свободной техники нет.</p>';return}$('bikes').innerHTML=bikes.map(b=>'<div class="bike" data-id="'+b.id+'"><img src="'+BIKE_IMG+'" alt="'+b.asset_code+'"><div class="bike-body"><div class="bike-code">'+b.asset_code+'</div><div class="muted">'+(b.model||'FastGo Courier')+'</div><div class="bike-status">Свободен</div></div></div>').join('')}function showDetails(){let d=days(),s=new Date($('startsAt').value),e=new Date($('endsAt').value);$('bikeDetails').classList.remove('hidden');$('bikeTitle').textContent=selectedBike.asset_code+' · '+(selectedBike.model||'FastGo Courier');$('detailTariff').textContent=tariff.name;$('detailDays').textContent=d+' дн.';$('detailPeriod').textContent=s.toLocaleDateString('ru-RU')+' — '+e.toLocaleDateString('ru-RU');$('detailPrice').textContent=tariff.price+' ₽'}$('startsAt').onchange=()=>syncEnd(true);$('endsAt').onchange=()=>syncEnd(false);$('continueBtn').onclick=async()=>{if(!tariff)return;let d=days();if(d<minDays){syncEnd(true);$('msg').textContent='Минимальный срок — '+minDays+' дн.';return}sessionStorage.setItem('fastgo_rental_start',$('startsAt').value);sessionStorage.setItem('fastgo_rental_end',$('endsAt').value);$('periodStep').classList.add('hidden');$('bikeStep').classList.remove('hidden');await loadBikes()};$('bikes').onclick=e=>{let el=e.target.closest('.bike');if(!el)return;document.querySelectorAll('.bike').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedBike=bikes.find(b=>b.id===el.dataset.id);sessionStorage.setItem('fastgo_selected_bike',selectedBike.id);sessionStorage.setItem('fastgo_selected_bike_code',selectedBike.asset_code);showDetails()};$('backBtn').onclick=()=>{$('bikeStep').classList.add('hidden');$('periodStep').classList.remove('hidden')};$('confirmBtn').onclick=()=>{if(!selectedBike){$('bikeMsg').textContent='Выберите велосипед.';return}location.href='fastgo-checkout.html'};load();</script></body></html>
