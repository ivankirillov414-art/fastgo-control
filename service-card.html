<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Техкарта ремонта — FastGo</title><style>:root{--b:#0b0f14;--p:#141b23;--p2:#0e141b;--l:#293542;--t:#eef2f7;--m:#96a3b4;--g:#b8ff35;--v:#c43cff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px 16px 60px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.num{font-size:36px;font-weight:950;color:var(--g)}.muted{color:var(--m)}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:11px;color:var(--m);text-transform:uppercase}.value{font-size:18px;font-weight:750;margin-top:3px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #3a4859;border-radius:10px;background:var(--p2);color:white;font:inherit}.field textarea{min-height:100px}.btn,button{border:0;border-radius:10px;padding:12px 15px;background:var(--g);color:#10150b;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}.btn.alt{background:#25303d;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{overflow:hidden;border:1px solid var(--l);border-radius:12px;background:var(--p2)}.photo img{width:100%;height:190px;object-fit:cover;display:block;cursor:pointer}.photo b{display:block;padding:8px}.rows{display:grid;gap:8px}.line{display:grid;grid-template-columns:1fr 140px 50px;gap:8px;align-items:center}.line input{width:100%;padding:9px;border:1px solid #3a4859;border-radius:9px;background:var(--p2);color:white}.line button{padding:8px;background:#4a2630;color:white}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quick button{padding:8px 10px;background:#25303d;color:white;font-size:13px}.totals{font-size:20px;font-weight:900}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:92vh}.viewer button{position:absolute;right:15px;top:15px;background:white;font-size:22px}.statusmsg{margin-top:10px;color:var(--m)}@media(max-width:700px){.grid,.photos{grid-template-columns:1fr}.line{grid-template-columns:1fr 110px 44px}}</style></head><body><main><div class="head"><div><div class="muted">FASTGO SERVICE</div><div id="num" class="num">Загрузка…</div><div id="created" class="muted"></div></div><div class="actions"><a class="btn alt" href="service-list.html">Все ремонты</a><a id="print" class="btn alt" target="_blank">Печать / QR</a></div></div><section class="card grid"><div><div class="label">Клиент</div><div id="fio" class="value"></div><div id="phone" class="muted"></div></div><div><div class="label">Техника</div><div id="bike" class="value"></div><div id="serial" class="muted"></div></div></section><section class="card"><div class="label">Неисправность</div><div id="issue" class="value"></div><div class="grid" style="margin-top:12px"><div><div class="label">Состояние</div><div id="condition"></div></div><div><div class="label">Комплектация</div><div id="accessories"></div></div></div></section><section class="card"><h2>Работа с заказом</h2><div class="grid"><div class="field"><label>Статус</label><select id="status"><option value="accepted">Принят</option><option value="diagnostics">Диагностика</option><option value="waiting_parts">Ждём запчасти</option><option value="repair">В ремонте</option><option value="ready">Готов</option><option value="issued">Выдан</option><option value="cancelled">Отменён</option></select></div><div class="field"><label>Назначенный мастер</label><input id="master" placeholder="Имя мастера"></div></div><div class="field"><label>Диагностика / комментарий мастера</label><textarea id="diag"></textarea></div><div class="field"><label>Плановая дата готовности</label><input id="promised" type="date"></div></section><section class="card"><h2>Работы</h2><div class="quick" id="quick"></div><div id="works" class="rows"></div><button onclick="addWork()">+ Добавить работу</button></section><section class="card"><h2>Запчасти</h2><div id="parts" class="rows"></div><button onclick="addPart()">+ Добавить запчасть</button></section><section class="card totals">Работы: <span id="labor">0 ₽</span> · Запчасти: <span id="partsTotal">0 ₽</span> · Итого: <span id="total">0 ₽</span></section><section class="card"><h2>Фотографии при приёмке</h2><div id="photos" class="photos"><span class="muted">Загрузка фотографий…</span></div></section><button id="save" style="width:100%;font-size:18px" onclick="save()">Сохранить изменения</button><div id="msg" class="statusmsg"></div></main><div id="viewer" class="viewer" onclick="closeViewer()"><button>×</button><img id="viewerImg"></div><script>const API='https://oqgpjfikjpcplnxueoki.supabase.co/functions/v1/fastgo-service-api',$=x=>document.getElementById(x);let d=null,works=[],parts=[];const quick=[['Передняя покрышка',700],['Задняя покрышка',1500],['Литая покрышка',2000],['Полная протяжка',500],['Тормозная ручка',400],['Колодки',300],['Тормозной диск',500],['Подшипники мотор-колеса',2000],['Подшипники колеса',1300],['Протяжка троса',500],['Установка фары',1000],['Диагностика электрики',2000]];async function api(action,params){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,params})}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');return j.data}const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderRows(){function row(x,i,type){return `<div class="line"><input value="${esc(x.name)}" oninput="${type}[${i}].name=this.value"><input type="number" min="0" value="${Number(x.price||0)}" oninput="${type}[${i}].price=+this.value;calc()"><button onclick="${type}.splice(${i},1);renderRows()">×</button></div>`}$('works').innerHTML=works.map((x,i)=>row(x,i,'works')).join('')||'<span class="muted">Работы пока не добавлены</span>';$('parts').innerHTML=parts.map((x,i)=>row(x,i,'parts')).join('')||'<span class="muted">Запчасти пока не добавлены</span>';calc()}function calc(){let l=works.reduce((s,x)=>s+Number(x.price||0),0),p=parts.reduce((s,x)=>s+Number(x.price||0),0);$('labor').textContent=money(l);$('partsTotal').textContent=money(p);$('total').textContent=money(l+p)}function addWork(name='',price=0){works.push({name,price});renderRows()}function addPart(){parts.push({name:'',price:0});renderRows()}function openViewer(src){$('viewerImg').src=src;$('viewer').classList.add('open')}function closeViewer(){$('viewer').classList.remove('open')}async function addPhoto(path,label){if(!path)return;try{let u=(await api('signed_url',{path})).url,el=document.createElement('div');el.className='photo';el.innerHTML=`<img src="${u}" alt="${esc(label)}"><b>${esc(label)}</b>`;el.querySelector('img').onclick=()=>openViewer(u);$('photos').append(el)}catch(e){}}async function load(){let sp=new URLSearchParams(location.search),params=sp.get('token')?{qr_token:sp.get('token')}:{id:sp.get('id')};d=await api('get',params);$('num').textContent='Ремонт № '+String(d.repair_number).padStart(4,'0');$('created').textContent=new Date(d.created_at).toLocaleString('ru-RU');$('fio').textContent=[d.last_name,d.first_name,d.middle_name].filter(Boolean).join(' ');$('phone').textContent=d.phone;$('bike').textContent=[d.vehicle_type,d.brand,d.model].filter(Boolean).join(' · ');$('serial').textContent='Серийный номер: '+(d.serial_number||'не указан');$('issue').textContent=d.issue_description||'не указана';$('condition').textContent=d.condition_notes||'не указано';$('accessories').textContent=d.accessories||'не указана';$('status').value=d.status;$('master').value=d.assigned_master||'';$('diag').value=d.diagnostics_notes||'';$('promised').value=d.promised_date||'';$('print').href='service-contract.html?id='+encodeURIComponent(d.id);works=Array.isArray(d.works)?d.works:[];parts=Array.isArray(d.parts)?d.parts:[];renderRows();$('quick').innerHTML=quick.map(([n,p])=>`<button onclick='addWork(${JSON.stringify(n)},${p})'>${n} · ${money(p)}</button>`).join('');$('photos').innerHTML='';await addPhoto(d.scooter_photo_path,'Общий вид');await addPhoto(d.display_photo_path,'Дисплей');await addPhoto(d.motor_photo_path,'Мотор-колесо');for(let i=0;i<(d.fault_photo_paths||[]).length;i++)await addPhoto(d.fault_photo_paths[i],'Неисправность '+(i+1));if(!$('photos').children.length)$('photos').innerHTML='<span class="muted">Фотографий нет</span>'}async function save(){if(!d)return;let l=works.reduce((s,x)=>s+Number(x.price||0),0),p=parts.reduce((s,x)=>s+Number(x.price||0),0);$('save').disabled=true;$('msg').textContent='Сохранение…';try{d=await api('update',{id:d.id,status:$('status').value,assigned_master:$('master').value.trim()||null,diagnostics_notes:$('diag').value.trim()||null,promised_date:$('promised').value||null,works,parts,labor_amount:l,parts_amount:p});$('msg').textContent='Изменения сохранены ✓';calc()}catch(e){$('msg').textContent=e.message}finally{$('save').disabled=false}}load().catch(e=>$('num').textContent='Ошибка: '+e.message)</script></body></html>
